id: 2026-10-11-architecture-centralize
reason: Refactor with no behaviour change - one owner for each repeated rule (dates, report permissions, money/pieces patterns, owed buckets, validation error helper, formatters) and no import cycle in application (guide §21.1).
owners: [domain, contracts, application, i18n, importer, web]
changes:
  - packages/domain - dates.ts is the single owner of monthOf, firstOfMonth, lastOfMonth, shiftMonth, daysBetween, datesBetween, clampDate and todayBusinessDate (uses ENTITY_TIMEZONE); owedBuckets exported once and used by compute-month and RECOVERY_ORDER
  - packages/contracts - reportPermissions and canViewReport next to reportIds; primitives.ts owns the amount and whole-number patterns with message-keyed schema factories (amountSchema, wholePiecesSchema moved there, same message keys); unused nonNegativeIntegerStringSchema removed
  - packages/contracts (fix) - amountPattern and wholeNumberPattern had lost their backslashes in the refactor (/^d+(.d{1,2})?$/); restored (escaped d and dot), with new primitives.test.ts covering amountSchema, positiveAmountStringSchema and wholePiecesSchema
  - packages/application - report-range.ts owns parseReportRange and MAX_REPORT_DAYS; namesFor moved to ledger.ts (breaks the daily <-> month cycle); invalid() lives in errors.ts; ledger month/day helpers and todayInDhaka removed (dates.ts keeps toDbDate/fromDbDate); getReport uses canViewReport; kinds.test.ts asserts contracts owed keys equal domain owedBuckets
  - packages/i18n - formatCount, formatMoney, formatDateTime added (no callers yet)
  - packages/importer - tmp-sep31.ts removed
  - apps/web - calendar-math keeps monthGrid/presetRange only; month helpers imported from @bsd/domain; dashboard and report pages use canViewReport; period.ts uses contracts monthSchema; xlsxResponse removed from server/api.ts
  - apps/web (second pass) - components/data-table.tsx owns money/quantity/table classes/StatusChip/ColumnHead/CartonQty/columnVisible (moved out of daily-kit); lib/today.ts useToday() replaces every businessDateOf(new Date()) and the private todayDate helpers; lib/async-action.ts useAsyncAction (confirm + describeError) used by money, shop-due (shared MoneyEntryTable), godown, damage, dsr-days, payroll and month pages; ReverseCell and EmptyListNote components; i18n key godown.reverse renamed common.reverse; features/reports/report-export.tsx (useReportDownload, ReportExportButtons) replaces both exportAs copies; payroll and money pages use domain owedBuckets; formatCount/formatMoney/formatDateTime replace local digit and toLocaleString wrappers; postingEffects gained products, workspace, staffLogin, opening with a useInvalidate helper in queries.ts (same keys invalidated); unreferenced web exports made private
affectedActionIds: []
financialImpact: none - refactor; no calculation changed
backfill: none
tests:
  - pnpm check (format, lint, typecheck, 181 unit tests; new domain date tests, i18n formatter tests, owedBuckets agreement test)
  - pnpm build
rollout: deploy the app
recovery: revert the commit
