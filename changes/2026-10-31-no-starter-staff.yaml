id: 2026-10-31-no-starter-staff
reason: >-
  Owner 2026-10-31 (D110). Master-panel delete of আমাদের স্টাফ failed because the person
  was assigned to an operating company. A new company should not be seeded with sample staff.
owners: [application, i18n]
changes:
  - >-
    packages/application staff.ts deleteStaff: the master company loads any non-SR person
    of the tenant and deletes them when nothing transactional refers to them and they have
    no login. Opening lines are released on every company whose opening is unlocked
  - >-
    packages/application opening-lock.ts releaseStaffOpenings: refuses when any of those
    companies has a month close
  - >-
    packages/application starter-dataset.ts: no STARTER_PEOPLE and no staff opening
    balances. Products, shops, shop dues, company advance, cash, roles and expense
    categories stay
  - packages/i18n bn.ts: company.starterDataHint no longer says staff are seeded
  - packages/application phase-i.integration.ts: expectations follow D110
affectedActionIds: [staff.delete, company.create]
financialImpact: >-
  A new company's opening no longer starts with sample staff advances, loans, salary
  payable or SR loan. Existing companies are unchanged. Deleting an unused person removes
  only their unlocked opening lines.
backfill: >-
  The owner asked to delete the screenshot rows নতুন ডিএসআর ১, নতুন ডিএসআর ২ and
  নতুন ম্যানেজার from the live database after confirming they have no use. That is a
  data delete, not a migration.
tests: >-
  packages/application phase-i.integration.ts covers an empty staff seed, master-panel
  delete of a person assigned to the operating company, refusal of an SR, and refusal of
  a person who has money entries
rollout: deploy the app; no migration
recovery: revert the commit. Deleted live rows are not restored by a revert
