id: 2026-10-09-negative-stock-block
reason: The owner wants stock to be the central balance that every product movement is checked against (D34). Negative closing stock came from Sep/Oct having no receipts in the workbook; postings could still take stock below zero with only an engine warning.
owners: [database, contracts, application, web, i18n, docs]
changedDefinitionIds:
  - docs/decisions.md (D34)
  - packages/database/prisma/migrations/20261009000000_block_negative_stock (company.block_negative_stock, default false)
  - packages/contracts/src/organization.ts (Company.blockNegativeStock, upsert field)
  - packages/contracts/src/errors.ts (ApiError.stockShortages for INSUFFICIENT_STOCK)
  - packages/application/src/stock-guard.ts (ensureStockCovers, new)
  - packages/application/src/daily.ts (DSR post/reverse, receipt reversal checked)
  - packages/application/src/damage.ts (buyer replacement post, company replacement reversal checked)
  - packages/application/src/companies.ts (switch saved; turning it on requires no negative stock today)
  - apps/web/src/data (updateCompany, ServiceError.stockShortages, refused-posting message lists product, date and pieces)
  - apps/web/src/features/daily/godown-page.tsx (switch on the receipt page for company.manage)
affectedActionIds:
  [sale.post, sale.reverse, purchase.reverse, damage replacement legs, company.manage]
affectedResources: [company, dsr_day, stock_entry, damage_event]
affectedMetrics:
  - none; the check only refuses postings, it never changes a figure
affectedUi:
  - receipt page shows the "মজুদের চেয়ে বেশি পণ্য বের হতে দেবেন না" switch
  - refused postings show which product would go below zero, from which date and by how much
schemaMigration: 20261009000000_block_negative_stock (applied to DIRECT_URL on 2026-10-09)
backfill: not-applicable (default off)
historicalPolicy: existing negative history is unchanged; the switch is off until the owner enters the missing receipts
contractCompatibility: additive (blockNegativeStock defaults to false; stockShortages optional)
cacheAndProjectionPlan: the workspace query is invalidated after the switch changes
securityReview: the switch needs company.manage; the check runs inside the posting transaction after the write
knownGaps:
  - imports are not checked (they must reproduce the sheet)
  - no integration test for the guard yet; not exercised against a database in this session
tests:
  - pnpm check (136 tests)
rollout: migration applied; deploy the app
recovery: turn the switch off; reverting the app leaves an unused column
