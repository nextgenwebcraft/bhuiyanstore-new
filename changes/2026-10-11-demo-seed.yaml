id: 2026-10-11-demo-seed
reason: The admin wants to see every screen filled with data and edit it later; a local-only script fills a demo company from one month sheet (D45, narrow exception to D36).
owners: [application, importer, docs]
changes:
  - packages/application - scripts/seed-demo.ts (CLI for args, database and writes through the application services only) and scripts/seed-demo-plan.ts (pure, sheet read result to a typed SeedPlan plus a counts-only summary); package script seed-demo runs Node with --max-old-space-size=8192 because loading the workbook needs about 8 GB of heap
  - packages/importer - readMonthSheetFile(path, sheet) (new month-file.ts) so the script can load a workbook without depending on exceljs
  - root - script db:seed-demo
  - docs - D45, implementation status, AGENTS.md commands
affectedActionIds: []
financialImpact: none for real companies; the script creates a separate company (refuses an existing name) with sample opening balances and two sample days that are not real business facts
backfill: none
tests:
  - seed-demo-plan.test.ts with the synthetic workbook (every product planned, shop due split sums exactly, required money kinds on both days, no negative pieces, 2-dp amounts)
  - pnpm db:seed-demo -- --dry-run against the local workbook (counts only; no database)
  - the database path is typechecked but not run (no database in this session)
rollout: local only; needs an existing super-admin (pnpm db:bootstrap-admin) and DIRECT_URL or DATABASE_URL in the root .env
recovery: delete the demo company's rows by hand or restore from backup; revert the commit to remove the script
