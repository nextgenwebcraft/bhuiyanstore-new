id: 2026-10-02-opening-balances
reason: PLAN §9 Phase D - opening balances per company (stock with prices, market due, staff and SR balances, company account, cash/bank), imported from a completed month sheet (D26) or the standard template (D28), reviewed, approved and activated once
owners: [contracts, domain, database, importer, application, web, i18n, architecture]
changedDefinitionIds:
  - packages/contracts opening.ts (new - openingStatuses, openingBalanceKinds, stock/balance lines with imported source, issues, totals, source report, save/transition requests, workbook sheets)
  - packages/domain opening.ts (new - OPENING_KIND_EFFECTS, checkOpening readiness issues and totals, toMonthOpening)
  - packages/database schema + migration 20261002020000_opening (opening_session, opening_stock_line, opening_balance_line with CHECKs on status, version, whole pieces, non-negative prices/amounts, kinds and party rules)
  - packages/importer opening.ts (new - loadWorkbook, monthSheetNames, proposeOpening from the month engine's closing, standard template build/read); synthetic-workbook.ts test fixture exported as @bsd/importer/testing
  - packages/application opening.ts (new - get/save with optimistic version, inspect/import workbook, template, approve, activate); MAX_OPENING_WORKBOOK_BYTES
  - packages/architecture resources (opening)
  - apps/web/src/server/api.ts (raw xlsx upload bodies for opted-in routes, handler-returned Responses, readBytes with a size cap, xlsxResponse)
  - apps/web/src/app/api/v1/companies/[companyId]/opening (GET/PUT, import, template, approve, activate)
  - apps/web/src/data (port methods, HTTP adapter with file upload/download, mock read-only stubs, opening query key and hooks)
  - apps/web admin/opening screen; navigation item implemented
  - packages/i18n bn.ts (opening screen labels, kinds, readiness issues, validation codes, validation.file.xlsx)
affectedActionIds:
  [opening.save, opening.import, opening.approve, opening.activate, product.price_set]
affectedResources:
  [
    opening_session,
    opening_stock_line,
    opening_balance_line,
    price_change,
    audit_event,
    idempotency_record,
  ]
affectedMetrics: the opening snapshot is the month engine's opening (toMonthOpening, tested to start from exactly the entered values); totals (stock value at cost, market due, staff owes us / we owe, company payable, cash) come from checkOpening
affectedUi:
  - new admin/opening screen - status, import from Excel (month sheet or template), template download, cutoff date, source report with unmatched products/persons, totals, tabs for stock, market due, staff, company, cash and review with approve/activate
  - in demo mode opening answers MODULE_UNAVAILABLE
schemaMigration: 20261002020000_opening (forward only, additive; applied to test and public 2026-10-02)
backfill: none; dev Drinko draft imported from Sep 2026 as a preview (33 products, 24 with stock, 9 blank where Excel was negative; no money balances because the Sep sheet has no money entries)
historicalPolicy: imported Excel values stay beside the entered values; any change after approval returns the opening to draft; activation locks the snapshot; prices are dated price_change rows at the cutoff date
contractCompatibility: additive only
cacheAndProjectionPlan: none (no Redis, D30); the opening query is replaced from each command's response; activation invalidates products, product history and the dashboard
securityReview: >-
  Workbook uploads are raw xlsx bodies (not a form-sendable type), keep the same-origin check and
  are capped at 40 MB before buffering; the file itself is never stored, only its SHA-256, name and
  the extracted values. Permissions opening.prepare / approve / activate are checked separately
  (tested). Cash accounts belong to the distributor, so activation row-locks them and refuses an
  account already opened by another company. No real workbook data in tests or fixtures; the
  synthetic fixture was moved out of month-sheet.test.ts unchanged.
tests:
  - pnpm check (format, lint incl. boundaries, typecheck of 10 projects, 123 Vitest tests incl. opening domain checks, proposal and template round-trip)
  - pnpm test:integration (25 tests; Phase D covers empty draft, month-sheet import with evidence, re-import keeping edits, stale version, party rules, approve blocked by errors, permission split, approval cleared by edits, idempotent activation, prices at cutoff, lock, template round-trip, cash account in one company only)
  - pnpm build
  - not run - browser walkthrough of admin/opening
rollout: pnpm db:migrate (applied to public 2026-10-02); open admin/opening, import the corrected Oct 2026 sheet (D26), set cutoff 2026-11-01, fill the blanks, approve and activate
recovery: revert commit; the migration is forward only and additive (drop the three opening tables to undo on the development database)
