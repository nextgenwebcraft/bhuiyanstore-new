id: 2026-10-28-shareholder-unmark-confirm
reason: >-
  Owner 2026-10-28, mid-turn request (D103, amends D94/D96): unchecking an
  already-paid shareholder month is easy to do by accident and hard to
  notice happened, so it now asks for confirmation; marking paid still does
  not.
owners: [web, i18n]
changes:
  - >-
    apps/web master-dashboard.tsx ShareholderPayoutTable: toggle() now runs through the existing
    useAsyncAction (window.confirm) helper, passing a confirm key only when the cell is currently
    paid (about to be unmarked); error display moved from local state to action.error
  - packages/i18n share.paid.unmarkConfirm
affectedActionIds: []
financialImpact: none - UI confirm only; the underlying mark/unmark write is unchanged
backfill: none
tests: pnpm test (318/318), pnpm --filter @bsd/web exec tsc --noEmit, eslint
rollout: deploy the app; no migration
recovery: revert the commit
