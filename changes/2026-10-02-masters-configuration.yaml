id: 2026-10-02-masters-configuration
reason: PLAN §9 Phase C - masters and configuration (products with dated carton sizes and prices, suppliers, staff with roles and assignments, expense categories, cash accounts, users and roles) on the real database
owners: [contracts, database, application, auth, web, i18n, architecture]
changedDefinitionIds:
  - packages/contracts catalog.ts (priceKinds, unitPriceSchema, productPack*, priceChange*, productHistorySchema)
  - packages/contracts parties.ts (supplier phone/status + upsert; staffRoleKinds incl. general, staffEmployers, recordStatuses, staffAssignment/staffRecord + create/upsert/assignment requests)
  - packages/contracts configuration.ts (new - staffRole, expenseCategory, cashAccount + upserts) and administration.ts (new - role, membership, user + create/update/password reset)
  - packages/contracts permissions (supplier.manage, staff.manage)
  - packages/database schema + migration 20261002010000_masters (product_pack owns carton size; price_change, supplier, staff, staff_assignment, staff_role, expense_category, cash_account)
  - packages/application dates.ts, products.ts (packs/prices/history), suppliers.ts, staff.ts, configuration.ts, administration.ts; access.requireSuperAdminView
  - packages/auth bootstrap (default staff roles for the tenant, also on the existing-admin path)
  - packages/architecture resources (productHistory, staffRecord, staffRole, expenseCategory, cashAccount, role, user)
  - apps/web/src/app/api/v1 (product history/packs/prices, suppliers, staff, staff assignments, staff-members, all staff, staff-roles, expense-categories, cash-accounts, roles, users, user password)
  - apps/web/src/data (port methods, HTTP adapter, mock read-only stubs, query hooks, describeError)
  - apps/web screens - product history dialog, supplier and staff management, masters/lists (staff roles, expense categories, cash accounts), admin/users, admin/roles; shared FormDialog and StatusField
  - packages/i18n bn.ts (screen labels, one key per server field-error code, one label per permission ID)
