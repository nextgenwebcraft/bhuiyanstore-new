affectedMetrics: none yet - the month engine still reads imported months; dated packs and prices are stored for later phases (posted lines keep their own snapshot)
affectedUi:
  - masters/products gains a history dialog (carton sizes and per-piece order/cost/sale prices by effective date)
  - masters/suppliers and masters/staff gain create/edit; staff shows dated assignments per company
  - new masters/lists, admin/users, admin/roles screens (navigation items now implemented)
  - in demo mode Phase C writes, roles, users and all-staff answer MODULE_UNAVAILABLE
schemaMigration: 20261002010000_masters (forward only; backfills product_pack from product.pieces_per_carton before dropping the column; CHECKs on quantities, prices, statuses, kinds and assignment periods; one base pack per product)
backfill: product_pack base rows from existing products (in the migration); default staff roles via pnpm db:bootstrap-admin
historicalPolicy: carton sizes and prices are dated rows; a same-date change replaces the earlier row and is audited with before/after. Staff assignments are ended with a to-date, never deleted; records are deactivated, never deleted
contractCompatibility: additive except staffMemberSchema.kind (now dsr | sr | general) and supplierSchema (phone, status with default); the product DTO is unchanged (piecesPerCarton = pack in force today, Asia/Dhaka)
cacheAndProjectionPlan: none (no Redis, D30); client caches invalidate by resource ID across the actor's companies
securityReview: >-
  Tenant lists, users and roles are super-admin only until delegated administration is designed;
  any tenant user may read the lists. Users are created with a one-time password and must change it;
  deactivation and password reset delete the user's sessions; the super-admin cannot deactivate or
  reset themselves. Passwords are excluded from the idempotency hash and the audit log (tested).
  Staff assignments in companies the viewer cannot access are hidden. SR roles require a supplier
  employer and DSR roles a distributor employer (D02, D23). No new dependencies.
tests:
  - pnpm check (format, lint incl. boundaries, typecheck of 10 projects, 108 Vitest tests incl. describeError)
  - pnpm test:integration (18 tests on the Neon test schema; Phase C covers T62 second company with different products, packs, prices, suppliers, staff roles/assignments/overlap, hidden assignments, lists, users and roles)
  - pnpm build
  - not run - browser walkthrough of the new screens and an HTTP smoke test (the super-admin's one-time password is still unchanged)
rollout: pnpm db:migrate (applied to public 2026-10-02) and pnpm db:bootstrap-admin (run 2026-10-02); sign in, change the one-time password, then create roles, users, staff roles and masters
recovery: revert commit; the migration is forward only, so restore from a Neon branch/backup if it must be undone (development database, to be cleared before production)
