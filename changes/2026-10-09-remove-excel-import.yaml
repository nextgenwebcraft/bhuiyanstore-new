id: 2026-10-09-remove-excel-import
reason: The owner asked to remove everything related to Excel import (D36). Openings and days are entered in the app only.
owners: [web, application, contracts, domain, importer, database, architecture, i18n, docs]
changedDefinitionIds:
  - apps/web - admin/import screen and route, opening import dialog, template download, the opening "উৎস" panel and "এক্সেল" columns removed; navigation entry removed; data port, HTTP adapter, mock and query hooks for imports removed; raw file upload support removed from the HTTP adapter and server/api.ts
  - apps/web/src/app/api - /companies/{id}/imports/**, /opening/import and /opening/template removed
  - packages/application - imports.ts and phase-h.integration.ts deleted; opening.ts loses inspect/import/template and the import evidence (source, sourceAmount); phase-d.integration.ts enters the same values by hand instead of importing
  - packages/contracts - imports.ts deleted; Opening loses source, stock line source and balance sourceAmount; OpeningWorkbookSheets removed
  - packages/domain - checkOpening no longer takes sourcePieces (opening.issue.sourceNegative removed)
  - packages/importer - opening.ts (opening proposal, template build/read, workbook loading) deleted; the month-sheet reader and report export stay
  - packages/architecture - resource import-job removed
  - packages/database - ImportJob model and opening source columns removed
  - packages/i18n - 166 import-only keys removed
affectedActionIds:
  [
    import.inspect,
    import.create,
    import.mapping,
    import.discard,
    import.commit,
    opening.import (all removed),
  ]
affectedResources: [import_job (removed), opening]
affectedMetrics:
  - none; no calculation changed
affectedUi:
  - admin/import removed from the sidebar and routes
  - admin/opening - no import or template buttons, no source panel, no Excel columns
schemaMigration: 20261009020000_remove_excel_import - drops import_job and opening_session.source_*, opening_stock_line.source, opening_balance_line.source_amount (applied to test and public; all were empty)
backfill: not-applicable
historicalPolicy: documents posted by earlier imports (reference import:{jobId}) are ordinary documents; the live data was cleared earlier the same day
contractCompatibility: breaking - the import routes and the Opening source fields are gone; the only client is this app
cacheAndProjectionPlan: none
securityReview: smaller attack surface - no file upload endpoint remains; writes accept JSON only
knownGaps:
  - PLAN §2.1 verification still depends on pnpm verify:workbook (local only, not run in this change)
  - browser walkthrough not done
tests:
  - pnpm check (133 tests)
  - pnpm test:integration 48/48 (Phase H suite removed; Phase D rewritten to manual entry)
rollout: migration applied; deploy the app
recovery: revert the commit and add a migration recreating import_job and the source columns (data was empty)
