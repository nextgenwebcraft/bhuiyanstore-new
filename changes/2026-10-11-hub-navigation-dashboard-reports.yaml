id: 2026-10-11-hub-navigation-dashboard-reports
reason: The owner wants a short sidebar of 9 hubs with tabs, and every report on the dashboard behind one period filter instead of separate day, month, stock, money, staff, samari and firot screens (D44).
owners: [web, application, contracts, i18n, docs]
changes:
  - apps/web - features/shell/navigation.ts keeps `navigation` as the only access rules (module and permission per path) and replaces flowGroups with `hubs` (9 hubs, Alt+1..9, visibleHubs, hubOfPath); `implemented`, findSectionById, visibleFlow and visibleNavigation removed; new shell/hub-tabs.tsx tab strip rendered once by company-shell; side-nav, mobile-nav (bottom bar dashboard, sales, goods, shops, more) and quick-jump list hubs and tabs; module-landing-page, section-route, ModuleCard, the catch-all route and the not-built state removed (unknown paths 404)
  - apps/web - pages reports/operations, reports/month, reports/stock, reports/money, reports/staff, sales/samari and sales/firot removed with DayReportPage, PersonsPage and the day money block; ReportTableView, PersonSales and ReportBody moved to features/reports/report-view.tsx; period-close keeps MonthPage and links to the dashboard for the chosen month
  - apps/web - dashboard-page.tsx rewritten - period filter (features/dashboard/period.ts, pure, unit tested; URL `?period=today|this-month|last-month|YYYY-MM|YYYY`), summary, today's work (today only), and report sections (dsr-daily and person-sales, sales and profit open; cash, stock and cartons, market due, company due and account, damage, staff balances fetch when opened) with per-report CSV/XLSX export and print
  - apps/web - getDashboardSummary takes a {from,to} range through the port, http adapter, mock (still read-only), query key and useDashboardSummary (keeps the previous data while another period loads)
  - packages/contracts - dashboardSummarySchema carries from, to and cutoffDate instead of date
  - packages/application - getDashboardSummary(ctx, companyId, {from,to}) validates with parseReportRange, runs the engine once over the range (rangeRun), sums summarizeDay per day with sumAmounts and merges per-DSR rows; marketDueOutstanding is the closing at the end of the range; cost and profit fields still omitted without inventory.cost_view / report.profit_view
  - apps/web - API route GET dashboard takes ?from&to instead of ?date
  - packages/i18n - hub, tab, period and dashboard section texts added; texts of the removed screens (report names of the old pages, samari/firot, day money block, landing, not-built) removed
  - docs - D44, PLAN §6 and §6.1, implementation status
affectedActionIds:
  [report.view, report.export, report.profit_view, inventory.cost_view, company.view]
financialImpact: none to any calculation; the dashboard totals for a single day are the same as before (one-day range), a longer range sums the same per-day engine figures; stockValue is the stock value at the end of the range (it used to be the stock at the time of the request)
backfill: none
tests:
  - features/dashboard/period.test.ts (parse, range, month and year choices, cutoff bounds)
  - features/shell/navigation.test.ts rewritten (every path in exactly one hub, order and Alt shortcuts, permission and module visibility, first visible tab, equivalentPath)
  - phase-e.integration.ts and sql-baseline.benchmark.ts call the range signature (typechecked; need TEST_DATABASE_URL to run)
rollout: deploy the app (no migration); old bookmarks to the removed screens give a not-found page
recovery: revert the commit
