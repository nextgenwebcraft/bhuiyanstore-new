id: 2026-10-22-hub-cleanup-no-opening-page
reason: >-
  Owner 2026-10-22 (D73) - staff statement as a dialog, receivable/payable screens removed, expenses
  and salary moved into the renamed হিসাব খাতা hub, টাকার লেনদেন renamed কোম্পানির হিসাব, এডিট
  instead of সম্পাদনা, and the প্রারম্ভিক তথ্য page removed because every new company is seeded.
owners: [web, i18n, docs]
changes:
  - apps/web navigation.ts - money hub = supplier deposits, company account; ledgers hub = cash book, staff balances, expenses, salary; opening hub and the dsr/statement, finance/receivables, finance/payables, admin/opening items removed
  - apps/web accounts-page.tsx - StaffStatementPage replaced by StatementDialog opened from the balances row (range, export, print)
  - apps/web routes - dsr/statement, finance/receivables, finance/payables, admin/opening pages and api/v1 companies/{id}/opening (+ cutoff, section) and /setup removed
  - apps/web administration - opening page, cards, section form, tables, draft (+ test) and setup-next removed; dashboard banner and no-opening links gone
  - apps/web data - getOpening, saveOpeningCutoff, saveOpeningSection, getSetupStatus removed from the port, http and mock adapters, queries and query keys
  - apps/web company-form.tsx - starter-data checkbox removed; always sends starterData true with an explanatory note
  - packages/i18n - unused opening, setup, statement, receivable and payable keys removed; hub names; সম্পাদনা -> এডিট; no-opening texts
  - docs - D73, implementation status
affectedActionIds: []
financialImpact: >-
  None. No calculation changes; the opening services, starter dataset and engine are unchanged. The
  staff statement shows the same lines in a dialog.
backfill: none
tests:
  - pnpm check:types, pnpm lint, pnpm test
rollout: deploy the app; no migration
recovery: revert the commit
