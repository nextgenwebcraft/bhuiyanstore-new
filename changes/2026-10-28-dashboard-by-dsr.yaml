id: 2026-10-28-dashboard-by-dsr
reason: >-
  Owner 2026-10-28 (D99). Sales happen DSR-wise, so the dashboard should
  break সারসংক্ষেপ's sales-chain totals out by person, filtered by the same
  period picker, below the existing summary cards.
owners: [domain, contracts, application, web]
changes:
  - >-
    packages/domain day-summary.ts: new profitLinesByDsr groups profitLinesOf's per-line data by
    staffId (same day.persons/day.products source); summarizeDay's byDsr rows gain
    issuedValue/returnValue/damageSaleValue/commission/totalSales/salesProfit via the existing
    salesProfit function, so a DSR's row can never disagree with the company-wide total
  - packages/contracts dsrDayRowSchema gains the same fields (salesProfit optional, cost/profit-gated)
  - >-
    packages/application daily.ts dashboardOf sums the new per-DSR fields across the range the same
    way as the existing ones; salesProfit included only behind inventory.cost_view + report.profit_view
  - >-
    apps/web dashboard-page.tsx new ByDsrTable (reuses dashboard.card.* labels) rendered in a new
    "ডিএসআর অনুযায়ী" section right under সারসংক্ষেপ, reading DashboardSummary.byDsr (follows the
    page's own period filter, no new query)
affectedActionIds: []
financialImpact: none - additional read-only breakdown of figures already computed for the dashboard total
backfill: none
tests: pnpm test (318/318, incl. domain/application suites), pnpm --filter @bsd/web exec tsc --noEmit, eslint
rollout: deploy the app; no migration
recovery: revert the commit
