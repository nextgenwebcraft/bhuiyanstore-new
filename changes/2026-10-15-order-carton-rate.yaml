id: 2026-10-15-order-carton-rate
reason: Owner decision D57 (2026-10-15) - the company order carries a carton rate and free goods; the receipt batch costs the order bill divided by paid plus free pieces. Amends D16 (free-goods UI), D48, D49 (cost source).
owners: [domain, contracts, database, application, importer, i18n, web, docs]
changes:
  - packages/domain - month/types.ts adds OrderInput and ProductDayInput.orders, CompanyEntryResult.freeQuantity/cartonRate; compute-month.ts orderStage() computes each product's day pool first (order bills, undelivered quantity incl. free pieces, receipt release, excess bill) so the receipt batch costs receiptValue / received; legacy ordered still works; batches.test.ts and compute-month.test.ts numbers changed by hand (comments in place); new order-carton-rate.test.ts
  - packages/database - migration 20261015010000_order_carton_rate (stock_entry free_pieces, carton_rate, pieces_per_carton; widened pieces check; order-terms check)
  - packages/contracts - stock line request validates order terms (rate required with paid pieces, free/rate on orders only, paid 0 only with free pieces); stock entry DTO carries freePieces, cartonRate, piecesPerCarton
  - packages/application - daily.ts stores order terms and writes the per-piece order price change; ledger.ts feeds orders to the engine; month.ts company statement gains freeQuantity and cartonRate columns; seed-demo-plan/seed-demo give order lines a carton rate; phase-e/phase-k integration tests adjusted, new phase-l.integration.ts
  - packages/importer - month-sheet.ts labels receipt-batch cost differences (Excel column H) as intended (batchPricing)
  - apps/web - new features/daily/order-form.tsx (cartons + pieces, carton rate, free goods, bill and per-piece cost preview, balance banner); godown-page.tsx receipt page without cost input and free-goods form, shows the order-derived cost; posted order list shows free, rate, bill
  - packages/i18n - order page, receipt cost, validation and statement column keys
  - docs - D57 added; PLAN 2.2/2.3 updated; implementation-status row
affectedActionIds: []
financialImpact: a receipt's batch cost is now the order bill per piece (free goods lower it) instead of the typed purchase price, so cost, gross profit, stock value and closing value of goods received change from this change on. Orders posted before have no carton rate and keep their order-price bill; their receipts now cost the order price per piece. Everything is recalculated from posted facts.
backfill: none needed. Existing order rows keep null rate/free/size and are read as plain ordered pieces.
tests:
  - npx prettier --check . ; npx eslint . ; pnpm check:types ; pnpm test
  - pnpm test:integration (new phase-l.integration.ts)
  - pnpm verify:workbook (NODE_OPTIONS=--max-old-space-size=8192)
rollout: apply the migration (pnpm db:migrate), then deploy the app
recovery: revert the commit; the migration only adds nullable columns and widens one check (rows with paid pieces 0 would need deleting before reverting it)
