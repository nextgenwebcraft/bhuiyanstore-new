id: 2026-10-06-work-order-navigation
reason: Owner asked for a UI ordered the way a workbook user works - daily entries first in day-block order with shortcuts, checking and month end next, rarely changed setup last and folded.
owners: [web, i18n]
changedDefinitionIds:
