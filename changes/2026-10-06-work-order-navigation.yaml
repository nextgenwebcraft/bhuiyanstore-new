  - apps/web/src/features/shell/quick-jump.tsx (new - Ctrl+K or / screen search; Alt+1..9 open the daily screens; inactive while a draft guard or another dialog is open)
  - apps/web/src/features/shell/mobile-nav.tsx (bottom tab bar - today, DSR sheet, goods received, market due, more)
  - apps/web/src/features/shell/company-shell.tsx (search button, quick jump, bottom padding for the tab bar)
  - apps/web/src/features/dashboard/dashboard-page.tsx (home is the day checklist in work order with what is already entered, then the day's figures; uses the shared working date)
  - apps/web/src/components/icons.tsx (search, check, chevronDown)
  - packages/i18n/src/bn.ts (nav.flow.*, nav.jump.*, nav.tab.*, dashboard.work.*; nav.group.* removed; nav.dashboard renamed)
