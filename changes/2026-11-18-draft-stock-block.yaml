id: 2026-11-18-draft-stock-block
reason: >-
  Owner 2026-11-18: draft দৈনিক বিক্রয় হিসাব must not save when godown/batch stock is
  short — even though draft does not cut balances until post. D34 had only blocked
  postings; API draft save had no ensureStockCovers. D136.
owners: [application, docs]
changes:
  - >-
    packages/application stock-guard — draftStockTakes, draftStockShortages,
    ensureDraftSalesCover (sheet date → today)
  - packages/application daily saveDsrDayIn — call ensureDraftSalesCover on draft save
  - docs/decisions.md D34 note + D136; implementation-status
affectedActionIds: [sale.create]
financialImpact: >-
  No ledger rewrite. Oversold drafts can no longer be saved via API; existing oversold
  drafts remain until edited down or discarded. Post/correct still use ensureStockCovers.
backfill: none
tests: packages/application stock-guard.test.ts; pnpm test:predeploy
rollout: deploy
recovery: revert commit
