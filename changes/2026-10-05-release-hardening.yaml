id: 2026-10-05-release-hardening
reason: Phase 1 release review. A resubmitted write after a network failure got a new idempotency key and could post a money or stock entry twice; reads had no timeout; API answers carried no cache policy; crashes outside a company had no error screen; small UI and rule duplicates.
owners: [web, application, contracts]
changedDefinitionIds:
  - apps/web/src/data/http/http-service.ts (PendingWriteKeys keeps one idempotency key per identical write until the server answers below 500; reads time out after READ_TIMEOUT_MS = 60 s, writes never time out on the client)
  - apps/web/src/data/use-request-key.ts (deleted, unused)
  - apps/web/src/server/api.ts (every /api/v1 answer is `cache-control: private, no-store`)
  - apps/web/next.config.ts (nosniff, Referrer-Policy, X-Frame-Options DENY, CSP frame-ancestors 'none', Permissions-Policy)
  - apps/web/src/components/page-error.tsx (shared error fallback) used by app/error.tsx, app/global-error.tsx (new) and app/c/[companyId]/error.tsx
  - apps/web/src/components/status-badge.tsx (one badge; opening, import, payroll, month and daily status keep their own status-to-tone mapping)
  - apps/web/src/features/reports/report-page.tsx, features/accounts/accounts-page.tsx (default range = presetRange("thisMonth"))
  - apps/web/src/features/accounts/payroll-page.tsx (lastOfMonth from components/calendar-math)
  - packages/contracts/src/organization.ts (MIN_PASSWORD_LENGTH owns the 12-character rule for schemas and screens; @bsd/auth keeps its server copy, equality tested in packages/application/src/password-policy.test.ts)
  - packages/application/src/access.ts (company and membership read in parallel)
  - packages/application/src/daily.ts (getDayView reads the opening and names in parallel)
affectedActionIds: [none]
affectedResources: [none]
affectedMetrics:
  - none; no engine input or output changed
affectedUi:
  - status badges on opening and import use the common padding (px-2.5 py-0.5 instead of px-3 py-1)
  - error screen on the company picker, sign-in and password pages
schemaMigration: none
backfill: not-applicable
historicalPolicy: unchanged
contractCompatibility: unchanged (one exported constant added)
cacheAndProjectionPlan: no server cache added. Redis stays out (D14) until a measured SQL baseline shows a need; the client keeps TanStack Query (30 s stale time, keys scoped by actor and company, invalidation per posting effect).
securityReview: API answers no longer cacheable by browsers or proxies; clickjacking blocked; no permission change
knownGaps:
  - no browser walkthrough of signed-in flows in this session (smoke test was signed out)
  - the auth package does not depend on the contracts package, so the password minimum exists twice, guarded by a test
tests:
  - pnpm check (130 tests, incl. new http-service.test.ts and password-policy.test.ts)
  - pnpm test:integration (55/55)
  - pnpm build
  - next start smoke test (security headers, 401 + no-store signed out, cross-origin write refused, 404, pages render)
rollout: one deploy
recovery: revert the commit
