id: 2026-10-28-shareholder-paid-spinner-fix
reason: >-
  Owner 2026-10-28: clicking the shareholder-paid checkbox showed no loading
  feedback and failed with a 500. Root cause (from the server log the owner
  pasted): setShareholderPayout's runIdempotent callback returned nothing, so
  idempotencyRecord.create's required Json `response` column got undefined —
  a genuine bug, not the stale dev-server client this was first (wrongly)
  diagnosed as.
owners: [web, application]
changes:
  - apps/web icons.tsx new "spinner" icon (an open ring, paired with animate-spin)
  - >-
    apps/web master-dashboard.tsx ShareholderPayoutTable: the checkbox is replaced by the spinner
    icon while that cell's toggle is pending, instead of just disabling the checkbox silently
  - >-
    packages/application company-hishab.ts setShareholderPayout: dropped runIdempotent/requestKey
    entirely and writes with a plain `$transaction`, matching the existing convention for every
    other void-returning write (deleteCompany, deleteProduct, deleteShop, ...); upsert-or-delete-by-
    unique-key is already idempotent on retry, so no idempotency record was needed in the first
    place. The PUT route and HTTP call no longer pass an idempotency key to the function (the
    client still sends the header; the server just no longer reads it for this one write).
affectedActionIds: []
financialImpact: none - bug fix; the write itself (mark/unmark paid) is unchanged
backfill: none
tests: pnpm test (318/318), pnpm --filter @bsd/application typecheck, pnpm --filter @bsd/web exec tsc --noEmit, eslint
rollout: deploy the app; restart/redeploy the running server so it also picks up today's two migrations
recovery: revert the commit
