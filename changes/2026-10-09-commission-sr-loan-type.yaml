id: 2026-10-09-commission-sr-loan-type
reason: The owner asked for a shop commission on the DSR day sheet that comes off the selling price (D41), and for SR loans and repayments to name their type, direct loan or product commission (D42).
owners: [domain, database, contracts, application, web, i18n, docs]
changes:
  - packages/domain - DsrLineInput.commission (taka, never negative); the engine takes it out of the line's sold value and person amount, the product's day sales and gross profit, and the day's sales and cash left; new commission fields on person, product and day money results and commissionTotal on product month and month totals
  - packages/database - dsr_line.commission NUMERIC(20,2) default 0 (check ≥ 0); money_entry.sr_loan_type (cash|commission, required for srLoan/srRepayment, NULL otherwise; existing SR loan entries set to cash)
  - packages/contracts - dsrLineRequestSchema.commission (default 0); commission on day product/person/money rows and month product/day rows and totals; srLoanTypes, srLoanTypeKinds; srLoanType on money entry request/response and SR statement lines
  - packages/application - saveDsrDay stores commission and refuses it on a line with no pieces sold; ledger passes it to the engine; postMoneyEntry requires srLoanType exactly for SR loan/repayment; staff statement shows it; sales report and dsr-daily report get commission columns
  - apps/web - day sheet commission column (taka) with totals and draft preview net of commission; day report commission column and money tile; money entry form type picker for SR loan/repayment; type shown in entry lists and the SR statement
  - packages/i18n - commission labels, SR loan type labels and hints, two validation messages
  - docs - D41, D42, PLAN §2.3 sales formula, P06 note, implementation status
affectedActionIds: [sale.create, sale.post, sr_loan.create, sr_loan.repay]
financialImpact: Shop commission lowers sales, the DSR's expected cash, cash left and gross profit by exactly the amount entered. With no commission entered every figure is unchanged (workbook verification unaffected). SR loan type changes no figure.
backfill: existing srLoan/srRepayment entries get sr_loan_type = cash in the migration
tests:
  - compute-month.test.ts - commission lowers sold value, sales, profit and cash left; negative commission refused
  - phase-e.integration.ts - commission stored per line and lowers sales and cash left; refused without a sale
  - phase-g.integration.ts - SR loan without a type refused; cash and commission loans and a commission repayment show their type on the statement; balance unchanged (one total)
rollout: apply the migration (pnpm db:migrate), regenerate the Prisma client, restart the app
recovery: revert the commit; the added columns have defaults or are nullable and can stay
