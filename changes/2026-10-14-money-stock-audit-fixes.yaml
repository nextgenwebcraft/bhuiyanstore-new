id: 2026-10-14-money-stock-audit-fixes
reason: Independent audit of the money and stock flow, answered by the owner on 2026-10-14 - D47 amendment (damage recovery is not profit), D52 cash and bank book, D53 godown damage and damaged-goods stock, D54 DSR cash handover settles the difference, D55 SR owed is an accrued SR incentive; the company money incentive stays company balance only (documented).
owners: [domain, contracts, database, application, i18n, web, docs]
changes:
  - packages/domain - compute-month.ts removes damageRecovery from netWithoutIncentive and from the profit output (kept as product and month-total memo); cash book (MonthOpening.cashAccounts and cashSnapshotMissing, DayInput.defaultCashAccount/defaultDepositAccount, MoneyEntryInput.account/toAccount, month.cashBook per account, output.cashEntries statement lines, closing.cashAccounts, warning CASH_SNAPSHOT_MISSING); day sales cash goes to the default account; godownDamaged input (stock, cost, damage value, no sales), damagedStock and damageAtCompany per product from companyDispatched, companyRejected, writtenOff, refunds and replacements, carried in closing and opening (default 0); money-kinds.ts gets cashTransfer, srOwed as an srIncentive expense, the book direction (cashBookEffect, moneyKindsWithAccount); damage-case.ts companyReject restores stillHere; opening.ts toMonthOpening feeds cash lines; day-summary drops damageRecovery; unit tests cash-book.test.ts and damaged-stock.test.ts, golden and damage tests changed by hand with comments
  - packages/database - migration 20261014020000_cash_book (money_entry.cash_account_id and to_cash_account_id FKs with indexes, kind CHECK gains cashTransfer, transfer-shape CHECK); schema.prisma relations on CashAccount
  - packages/contracts - cashTransfer kind and permission, moneyAccountKinds, cashAccountId/toCashAccountId on the money entry request with account rules, account names and dsrDayId on the money entry DTO, godownDamaged/damagedStock/damageAtCompany on day and month product rows, profit.damageRecovery removed from the month view, dashboard damageRecovery removed and cashAccounts added, report id cash-book (finance.view), cash handover comment updated
  - packages/application - ledger.ts cashDefaults (default cash and deposit accounts), account/toAccount and defaults fed to the engine, godown damage stock entries as godownDamaged, dispatch/reject/write-off events fed, old month-close snapshots flagged cashSnapshotMissing; daily.ts account validation and default stored on the entry, settleHandover on DSR day post (staffShortage/staffExcess owned by the day, refused for individual reversal with validation.money.dsrDayOwned, reversed with the day), godown damage checked against the negative-stock block, dashboard cash accounts; damage.ts refuses fromStock on a DSR-day case; month.ts cash-book report (summary and statement, all time), stock and damage report columns, profit line removed; namesFor returns cash accounts; kinds.test.ts and phase-e fixture updated; new phase-j.integration.ts
  - apps/web - AccountSelect on the money, shop due and company account (supplier deposit) forms, account column on the money table, new cash book page finance/cash-book with a transfer dialog and an account filter, navigation entry and ledgers tab, dashboard cash section lists cash-book and each account balance, damage recovery tile and month profit line removed, stock page columns, DSR sheet difference note
  - packages/i18n - labels for the cash book, accounts, transfer, srIncentive/srOwed, damaged stock columns, handover note, new validation keys and warning CASH_SNAPSHOT_MISSING; damage recovery relabelled as a memo (ড্যামেজ বাবদ ফেরত)
  - docs - D52-D55 added, D39 and D47 amended in decisions.md; PLAN 2.3, 2.4, 2.5 and 5 updated; implementation-status row
affectedActionIds: []
financialImpact: net profit no longer includes damage refunds and replacement goods (lower by that memo amount); godown damage entries now lower stock and charge cost (gross profit falls by qty x cost, damage value rises) where they used to be product-level damaged with no stock effect; srOwed now adds to the SR incentive expense (net profit lower by the accrued amount); a DSR day posted with a short or over cash handover now creates a staff shortage or excess (staff balances and the day cash left change by the difference); a cash/bank book exists per account. Everything is recalculated from posted facts, no stored total changes. Month-close snapshots stored before this change have no account balances, so the cash book starts those accounts at 0 and warns until the month is reopened and closed again.
backfill: none needed. Existing money entries keep a null account and use the company default when read. Old godown damage stock entries now act as godown damage (stock falls) - review closing stock of months that used them.
tests:
  - pnpm check (format, lint, types, unit tests; the .claude worktree folder of another agent excluded from prettier/eslint)
  - pnpm test:integration (new phase-j.integration.ts)
  - pnpm verify:workbook (needs NODE_OPTIONS=--max-old-space-size=8192 on this machine)
rollout: apply migration 20261014020000_cash_book, then deploy the app
recovery: revert the commit; the migration only adds nullable columns and widens a CHECK, so the previous app version keeps working on the new schema
