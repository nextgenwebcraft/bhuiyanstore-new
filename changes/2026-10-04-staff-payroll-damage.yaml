id: 2026-10-04-staff-payroll-damage
reason: PLAN §9 Phase G - staff money accounts and statements (D27), SR accounts (D18), payroll with recovery and Cash Pabe (D11, D24, D25), damage cases with independent buyer and company legs (D17)
owners: [domain, database, contracts, application, i18n, web, architecture]
changedDefinitionIds:
  - packages/domain/src/month/money-kinds.ts (staffOffset - owed and credit down, no cash; srOffset - SR loan and owed-to-SR down, no cash; both only when entered, never automatic)
  - packages/domain/src/month/compute-month.ts (staffEntries - one ledger line per money entry with its change and running balances; stock adds company replacements and subtracts replacedFromStock; damageValue includes replacedFromStock; replacementValue)
  - packages/domain/src/month/types.ts (MoneyEntryInput.ref, ProductDayInput.replacedFromStock and replacements, StaffEntryResult, replacement fields on day/month results)
  - packages/domain/src/month/payroll.ts (proposeRecovery advance → loan → shortage capped at salary, cashPay, checkRecovery)
  - packages/domain/src/month/damage-case.ts (damageLineProgress, damageEventError over-dispatch/acceptance/replacement/write-off, damageCaseSettled)
  - packages/contracts/src/accounts.ts (staff accounts, statement, payroll run/line/save/transition); staffBalancesSchema now owned by month.ts and reused
  - packages/contracts/src/damage.ts (damage case, line, event, progress, create/event requests)
  - packages/contracts/src/daily.ts (money entry allocation advance/loan/shortage and payrollRunId; offset kinds with person and permission)
  - packages/contracts/src/month.ts (month product row and totals carry replacedFromStock, replacementReceived, replacementValue)
  - packages/application/src/accounts.ts (getStaffAccounts, getStaffStatement, exportStaffStatement)
  - packages/application/src/payroll.ts (getPayrollRun, savePayrollRun, payrollCommand approve/pay/reverse/discard)
  - packages/application/src/damage.ts (list/get/create case, post/reverse event, cancel case)
  - packages/application/src/daily.ts (allocation sum and limit checks, offset limits, payroll-owned entries refuse manual reversal)
  - packages/application/src/ledger.ts (money entry ref and allocation; posted buyer replacements from stock and company replacements as engine inputs)
  - packages/application/src/month.ts (damage report columns replacedFromStock, replacementReceived, replacementValue)
  - packages/database/src/client.ts (search_path set when a schema is selected, so raw row locks hit the test schema; production unchanged)
  - packages/architecture/src/resources.ts (payroll-run, damage-case)
  - packages/i18n/src/bn.ts (validation.money/payroll/damage, offset kinds, statement/payroll/damage screens)
affectedActionIds:
  - money.post (allocation, offsets), money.reverse (payroll-owned refused)
  - payroll.save, payroll.approve, payroll.pay, payroll.reverse, payroll.discard
  - damage.case, damage.event, damage.reverse, damage.cancel
affectedResources: [moneyEntry, payrollRun, damageCase, ledger, dashboardSummary]
affectedMetrics:
  - staff balances and statement lines are engine fields (staffEntries); nothing netted or summed in application or UI
  - godown stock now moves for company replacements (+) and buyer replacements from stock (-); damage value includes the latter
  - payroll salary expense = Σ salaryAccrual; recovery reduces owed and salary payable; Cash Pabe leaves cash on the pay date
affectedUi:
  - dsr/accounts and dsr/statement (new, finance.view); sr-accounts/representatives and sr-accounts/statement (sr_loan.view)
  - dsr/salary-recovery is now the payroll run (compensation.view; was manual salary entries)
  - inventory/claims damage cases (damage.report and leg permissions)
  - dsr/settlements adds staffOffset and an optional allocation; sr-accounts/settlements adds srOffset
  - reports/stock damage table shows replacement columns
schemaMigration: 20261004000000_staff_payroll_damage (applied to test and public) - money_entry kind CHECK rebuilt, allocation columns with sum CHECK, payroll_run_id; payroll_run with one live run per company and month (partial unique), payroll_line; damage_case, damage_case_line, damage_event with CHECKs
backfill: not-applicable (new columns nullable; no existing payroll or damage rows)
historicalPolicy: payroll and damage legs are corrected by reversal, never edited; reversal is refused in a closed month (posting guard). An approved run snapshots what each person owed before recovery
contractCompatibility: additive routes GET /staff-accounts?kind&date, GET /staff/{staffId}/statement?from&to[&format], GET|PUT /payroll-runs/{month}, POST /payroll-runs/{month}/{approve|pay|reverse|discard}, GET|POST /damage-cases, GET /damage-cases/{id}, POST /damage-cases/{id}/events, POST /damage-cases/{id}/cancel, POST /damage-events/{id}/reverse; money entry request gains optional allocation
cacheAndProjectionPlan: no stored projections; statements replay through rangeRun from the last closed month (or the opening)
securityReview: distributor accounts need finance.view; SR accounts finance.view or sr_loan.view; statement export also report.export. Payroll view compensation.view, save compensation.manage, approve + dsr_due.allocate_to_salary, pay + payment.post, reverse + payment.reverse. Damage legs per guide §12.2 (buyer leg damage.report, company legs damage.claim_settle, company replacement also inventory.cost_view, write-off damage.approve); unit cost redacted without inventory.cost_view. Case and run writes lock their row FOR UPDATE; all writes idempotent and audited. Module enablement still not enforced server-side
knownGaps:
  - cash book per account is still not modelled
  - damage cases are quantities only; no lot/batch traceability (V1)
  - salary is entered per run, prefilled from the previous run; there is no salary master
  - manual salaryAccrual/salaryRecovery/salaryPaid entries remain possible through the API (no screen)
tests:
  - pnpm check (format, lint incl. module boundaries, typecheck of 10 packages, 114 Vitest tests incl. staff-accounts.test.ts T56-T58, T25-T27, offsets, damage legs, replacement and replaced-from-stock stock effects, kinds.test.ts contract/engine list equality)
  - pnpm test:integration 48/48 on the Neon test schema (13 Phase G - T55 SR refused on a DSR sheet; T58 statement lines never netted; T25 SR loan cash and receivable only; allocation and offset limits; statement export with translated labels and SR-only viewer; payroll proposal, validation, override with reason, live re-proposal, permissions, approve/pay T56/T57/T26/T27 balances and Cash Pabe, payroll-owned reversal refused, run reversal and discard; damage legs through the ledger, over-replacement/over-dispatch, unit cost required, reverse order, cancel rules, cost redaction and leg permissions)
  - pnpm build
  - pnpm verify:workbook (local only) - every compared figure still matches
  - not run - browser walkthrough
rollout: migration applied; screens live behind NEXT_PUBLIC_DATA_SOURCE=http (the demo mock answers MODULE_UNAVAILABLE)
recovery: revert commit and drop the new tables/columns with a down migration (no existing rows depend on them)
