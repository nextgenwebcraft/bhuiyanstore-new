id: 2026-11-07-staff-delete-cascade
reason: >-
  Owner 2026-11-07 (D116). এসআর হিসাব needs delete; deleting an SR or আমাদের স্টাফ
  person must wipe related hishab so balances recalculate, with the alert listing
  every adjustment bucket.
owners: [application, contracts, web, i18n]
changes:
  - >-
    packages/contracts parties.ts: staffDeleteImpactSchema for the confirm preview
  - >-
    packages/application staff.ts: getStaffDeleteImpact; deleteStaff wipes money,
    opening lines, payroll lines, DSR days, field visits/reports, damage cases,
    clears shop added-by and unlinks login, then deletes the person (amends D51/D110)
  - >-
    apps/web: GET .../staff/:id/delete-impact; StaffDeleteButton with impact list;
    এসআর হিসাব table delete; আমাদের স্টাফ uses the same button
  - packages/i18n bn.ts: staff.delete.impact.* and sr.delete.confirm
  - docs/decisions.md D116
affectedActionIds: [staff.delete]
financialImpact: >-
  Deleting a person removes their posted money and day-sheet facts. Open-period
  balances, stock and dashboard figures recalculate without them. Closed-month
  snapshots are unchanged until a month is reopened and closed again.
backfill: none
tests: >-
  packages/application phase-i.integration.ts — master delete still refuses an SR;
  unused manager delete; mistagged supplier+manager delete; DSR with money entries
  is deletable and gone after wipe
rollout: deploy the app; no migration
recovery: revert the commit; wiped rows are not restored
