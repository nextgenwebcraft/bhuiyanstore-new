id: 2026-10-14-starter-dataset
reason: >-
  D51 (owner decision 2026-10-14) plus the standard expense categories request. Decision wording for docs/decisions.md - "D51 | Starter dataset for a new company | Creating a company (super-admin) clones a synthetic starter dataset into it in the same transaction as the company - 8 sample products (names prefixed নমুনা, carton sizes, order/cost/sale prices), 2 DSRs and 1 manager (distributor staff assigned to the company with a monthly salary), 4 sample shops - and creates, only when missing by name, the standard tenant lists (expense categories অফিস খরচ, পরিবহন খরচ, লোড আনলোড, বিদ্যুৎ বিল, গ্যারেজ ভাড়া, গোডাউন ভাড়া; cash accounts ক্যাশ, ব্যাংক; staff roles ডিএসআর, এসআর, ম্যানেজার). No opening and no daily records. The data is synthetic and lives in packages/application/src/starter-dataset.ts (nothing from docs/*.xlsx). The company form has the checkbox নমুনা তথ্য দিয়ে শুরু করুন (default on); the request field is starterData (default true). Products, staff and shops can be hard-deleted while never used in any record (audited, product.edit / staff.manage / shop.manage); a used one is refused with a message to deactivate or archive it. Starter prices are dated the company's creation day (Dhaka) with source starter; the opening stock section replaces the starter price of a product and kind whenever it writes its own price, so the owner's opening prices win for any go-live date."
owners: [contracts, application, database, i18n, web]
changes:
  - packages/application - starter-dataset.ts (constants STANDARD_EXPENSE_CATEGORIES / STANDARD_CASH_ACCOUNTS / STANDARD_STAFF_ROLES, the sample masters and applyStarterDataset); createCompany parses companyCreateRequestSchema and, when starterData is true, calls applyStarterDataset on the same transaction client (direct tx inserts, not the idempotent public services, so there is one atomic unit and one audit event company.starter_data; a failure leaves neither company nor sample data); opening.ts writeOpeningPrices deletes source=starter rows of the product and kind when it writes the opening price; deleteProduct, deleteStaff and deleteShop (hard delete inside a transaction, audited as product.delete / staff.delete / shop.delete); isForeignKeyViolation backstop; seed-demo.ts and every integration test and the SQL benchmark create their companies with starterData false
  - packages/application "used" definition - product - any opening stock line, godown stock entry, DSR line, field visit line or damage case line (its own pack and price rows cascade away); staff - any opening balance, DSR day, field visit, money entry (also reversed), payroll line, damage case, shop added by them, a linked login, or an assignment in another company (their own assignments in this company cascade away); shop - any money entry (also reversed), opening balance or field visit. A used record is refused with validation.product.inUse / validation.staff.inUse / validation.shop.inUse (deactivate or archive instead)
  - packages/contracts - companyCreateRequestSchema (companyUpsertRequestSchema plus starterData, default true) for creation only; update is unchanged
  - packages/database - migration 20261014010000_standard_expense_categories inserts লোড আনলোড, বিদ্যুৎ বিল, গ্যারেজ ভাড়া, গোডাউন ভাড়া for every existing tenant with ON CONFLICT (tenant_id, name) DO NOTHING; ids are cuid-shaped text (c + 24 md5 hex characters) because Prisma generates ids in the client; keep the list in sync with STANDARD_EXPENSE_CATEGORIES
  - >-
    apps/web - DELETE routes for /api/v1/companies/{id}/products/{id}, /staff/{id}, /shops/{id}; port, HTTP adapter (empty JSON body), mock adapter (product delete only, staff and shop stay demo read-only) and query hooks; components/delete-button.tsx (confirm dialog showing the server's refusal); delete action on the product list, staff page and shops page; company form checkbox
  - packages/i18n - company.starterData*, common.delete*, *.delete.confirm, validation.*.inUse
affectedActionIds: [company.create, product.delete, staff.delete, shop.delete]
financialImpact: >-
  none - starter data has no opening, stock, due or money entries; the sample salaries only seed assignments (no payroll run). Starter prices are catalog prices only.
backfill: >-
  every existing tenant receives the four new expense categories through the migration (insert-if-missing); existing companies get no sample data
tests:
  - pnpm check
  - pnpm build
  - pnpm test:integration (phase-i.integration.ts - starter dataset created atomically and not when off, lists created only when missing, rollback when the dataset fails, opening price replaces starter price, delete unused succeeds and used is refused for product/staff/shop, manage permissions, migration insert-if-missing and repeatable)
rollout: >-
  run pnpm db:migrate, then deploy the app
recovery: >-
  revert the commit; the four inserted categories can stay (they are ordinary tenant list rows)
