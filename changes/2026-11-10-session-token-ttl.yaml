id: 2026-11-10-session-token-ttl
reason: >-
  Owner: improve login — access token 7 days, refresh token 30 days (D124).
owners: [auth]
changes:
  - >-
    packages/auth: Better Auth session expiresIn 30 days, updateAge and
    cookieCache.maxAge 7 days; named ACCESS_TOKEN_TTL_SECONDS /
    REFRESH_TOKEN_TTL_SECONDS
  - >-
    packages/auth actorFromHeaders always getSession with disableCookieCache so
    revoke/deactivate is not delayed by the 7-day cookie cache
  - docs/decisions.md D124; implementation-status note
affectedActionIds: []
financialImpact: none
backfill: none — new sign-ins get the new TTLs; existing sessions keep their prior expiresAt until refreshed or expired
tests: pnpm --filter @bsd/auth typecheck
rollout: deploy auth package with the web app; no migration
recovery: revert the auth session config to expiresIn 12h / updateAge 1h
