id: 2026-10-06-drinko-load-negative-due
reason: Owner asked to clear business data and load the latest workbook month - Aug 2026 closing as the opening on 2026-09-01 and Sep 2026 posted and closed. Needed D31 (goods due from company may be negative) and an option to add the typed block after the last day to that day.
