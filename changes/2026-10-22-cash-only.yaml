id: 2026-10-22-cash-only
reason: >-
  Owner 2026-10-22 (D72) - all money is cash; no bank account. The হিসাব (নগদ / ব্যাংক) option,
  transfers and the per-account cash book are removed from code, UI and calculation.
owners: [contracts, application, i18n, web, docs]
changes:
  - packages/contracts daily.ts - money request has no cashAccountId / toCashAccountId (and no transfer checks); MoneyEntry has no account fields; moneyAccountKinds removed
  - packages/contracts reporting.ts - DashboardSummary.cashAccounts removed
  - packages/contracts opening.ts - Opening.cashAccountId (the company's single cash account)
  - packages/application ledger.ts - cashAccountOf replaces cashDefaults; every opening cash balance folded into one bucket, deposits default to it, entry accounts ignored, old cashTransfer entries left out; namesFor has no accounts
  - packages/application daily.ts - postMoneyEntry refuses cashTransfer (kindRetired) and stores no account; dashboard has no account balances
  - packages/application month.ts - cash-book report is one summary row and a statement without account columns
  - packages/application opening.ts - the view folds every cash line into one line on the cash account and returns cashAccountId
  - packages/application starter-dataset.ts, scripts/seed-demo-plan.ts - only the cash account (demo opening cash 250000 in one line)
  - packages/application kinds.test.ts, phase-j.integration.ts - D52 account tests replaced by D72 cash-only tests (old bank entry and transfer inserted as history)
  - apps/web - account picker, transfer dialog, account filter and account columns removed; cash book shows opening / in / out / closing; lists page has no cash accounts; opening cash card is one row from Opening.cashAccountId; cash-accounts API routes and config list removed
  - packages/i18n - account and transfer keys removed; cash texts say নগদ only
  - docs - D72, PLAN cash book text, implementation status
affectedActionIds: []
financialImpact: >-
  The cash book total is unchanged: every account's balance was already cash on hand and is now one
  balance (old transfers net to zero). Per-account balances are no longer shown. A supplier deposit
  leaves the cash as before (D63 investment rule unchanged). Profit, staff and company figures do
  not change.
backfill: none (database columns and old rows stay; the ledger folds them at read time)
tests:
  - pnpm check:types, pnpm lint, pnpm test (307 unit tests)
  - pnpm test:integration phase-j, phase-d, phase-i, phase-c (47/47); phase-e, phase-f, phase-g, production-setup
rollout: deploy the app; no migration
recovery: revert the commit
