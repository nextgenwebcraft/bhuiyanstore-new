id: 2026-10-29-opening-drop-order-price
reason: >-
  Owner 2026-10-29 (D104). প্রারম্ভিক মজুদ's separate অর্ডার মূল্য/পিস field
  was redundant with ক্রয়মূল্য; the owner asked to use ক্রয়মূল্য for what
  it was doing (valuing কোম্পানি থেকে পাওনা, seeding the first order's
  default price) and keep only two prices on that screen. Confirmed this
  does not touch the live order/receipt screen's own order-price mechanism
  (D57), which still diverges from cost when there are free goods.
owners: [database, contracts, domain, application, web, i18n]
changes:
  - >-
    packages/database migration 20261029010000_drop_opening_order_price: drops
    opening_stock_line.order_price
  - >-
    packages/contracts opening.ts: orderPrice removed from openingStockLineSchema and the stock
    save-request line
  - >-
    packages/domain opening.ts toMonthOpening: ক্রয়মূল্য (unitCost) now sets both orderPrice and
    costPrice on the opening's engine state, instead of reading a separate opening orderPrice
  - >-
    packages/application opening.ts: stops reading/writing orderPrice on OpeningStockLine; the
    "order" price_change row writeOpeningPrices writes at activation now takes its price from
    unitCost; ledger.ts liveOpening updated the same way; starter-dataset.ts no longer seeds it
  - apps/web opening-page.tsx: removed the অর্ডার মূল্য/পিস column and input entirely
  - packages/i18n opening.stock.orderPrice removed (unused)
  - >-
    9 integration test fixtures (phase-d/e/f/g/i/j/k/l, starter-dataset-dependent) updated for the
    removed field; phase-d's "keeps a daily price over the opening price" test now varies unitCost
    instead of a separate orderPrice to exercise the same manual-price-wins-on-re-save behavior
affectedActionIds: [opening.stock.save]
financialImpact: >-
  opening-time only: কোম্পানি থেকে পাওনা's value and a product's first post-go-live order price
  now come from ক্রয়মূল্য instead of a separately entered figure; an opening already activated
  keeps its previously-written "order" price_change until its stock section is next re-saved. The
  order/receipt screen's own order pricing (D57) is unaffected.
backfill: none - existing activated openings are unaffected until re-saved
tests: pnpm test (318/318), pnpm check:types (whole repo), eslint, prettier
rollout: deploy the app; run pnpm db:migrate (already applied to the live database)
recovery: revert the commit; the migration is a column drop with no down-migration written
