id: 2026-10-03-daily-entry
reason: PLAN §9 Phase E - users enter the workbook's raw daily facts through the API; every figure shown back comes from the month engine
owners: [database, application, contracts, domain, web]
changedDefinitionIds:
  - packages/database/prisma/migrations/20261003000000_daily (stock_entry, dsr_day, dsr_line, dsr_price_split, money_entry, month_close)
  - packages/application/src/ledger.ts (runLedger - posted facts from the active opening to MonthInput; closed months start from their month_close snapshot)
  - packages/application/src/daily.ts (stock entries, DSR day sheets, money entries, day view, dashboard summary; posting guard)
  - packages/domain/src/month/day-summary.ts (summarizeDay - dashboard figures from the engine's day result)
  - packages/contracts/src/daily.ts (DTOs; moneyKindPerson, moneyKindPermission and moneyCategoryKinds are the single owner shared by server and screens)
  - packages/architecture/src/resources.ts (batch, goodsReceipt, dailySalesSummary, marketDue, oldDueCollection removed; stockEntry, dsrDay, moneyEntry, ledger added)
  - apps/web/src/data (port, HTTP adapter, query keys and hooks for daily entry; the mock is read-only for daily entry)
  - packages/database/src/client.ts (interactive transaction timeout 60 s for the ledger replay)
affectedActionIds:
  - stock.post, stock.reverse, dsr_day.save, dsr_day.post, dsr_day.reverse, dsr_day.discard, money.post, money.reverse (audited)
affectedResources: [stockEntry, dsrDay, moneyEntry, ledger, dashboardSummary]
affectedMetrics:
  - every daily figure (sales, cost, profit, stock, due from company, market due, cash left, staff and SR balances) is now computed by computeMonth from posted facts; the prototype's FEFO batch layers and client-side summaries are gone
affectedUi:
  - purchases/orders, purchases/receipts, inventory/damage (godown entry with carry-forward prices)
  - sales/daily-summaries (DSR day sheet - samari, firot, damage, one price split, বাকি, collection; draft/post/reverse)
  - sales/samari, sales/firot, reports/operations, inventory/stock (engine read-only views)
  - sales/old-dues-collection, finance/expenses, finance/supplier-deposits, sr-accounts/incentives, sr-accounts/settlements, dsr/settlements, dsr/salary-recovery (money entries)
  - dashboard (engine day summary); inventory/batches returns to "not built yet" until a lot/expiry list exists
schemaMigration: additive (new tables only); applied to public and test 2026-10-03
backfill: not-applicable (daily entry starts at the activated opening's cutoff)
historicalPolicy: posted rows are immutable; corrections reverse and re-enter; a closed month refuses posting and reversal
contractCompatibility: removed prototype procurement/sales/inventory contracts (only the mock used them); new /api/v1/companies/{id}/days, dashboard, stock-entries, dsr-days, money-entries routes
cacheAndProjectionPlan: no stored projections; each read replays from the opening (or the last month_close) to the date. Measure before adding caching (Redis stays out)
securityReview: every route goes through application use cases with company + permission checks (cost/profit redacted without inventory.cost_view / report.profit_view); writes are idempotent by request key except draft discard (plain transaction, version-checked). Module enablement is not enforced server-side on daily endpoints yet (permissions only)
tests:
  - pnpm check (format, lint, typecheck of 10 packages, 99 Vitest tests)
  - pnpm test:integration 31/31 on the Neon test schema (6 Phase E - services reproduce an independently computed computeMonth across 2026-08-30..2026-09-02, rule rejections, redaction, reversal and idempotent replay, closed month)
  - pnpm build
  - not run - browser walkthrough; real-workbook replay through the services (Phase H)
rollout: migration applied; screens live behind NEXT_PUBLIC_DATA_SOURCE=http
recovery: revert commit; the migration only adds tables (drop them to roll back)
