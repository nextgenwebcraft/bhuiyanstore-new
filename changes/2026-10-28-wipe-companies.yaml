    packages/application one-time script scripts/wipe-companies.ts (pnpm db:wipe-companies, dry run
    by default, --apply to write): deletes, per removed company, money_entry, damage_event,
    damage_case, payroll_run, stock_entry, dsr_day, field_visit, field_day_report, opening_session,
