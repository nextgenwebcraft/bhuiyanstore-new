id: 2026-10-07-table-ux
reason: Owner feedback - carton/piece numbers were unexplained, long tables were hard to move around, the per-DSR product list was one long table, filtering kept old rows instead of a skeleton, and a crash in a setup screen took down the whole site.
owners: [web, i18n]
changedDefinitionIds:
  - apps/web/src/components/table-scroller.tsx (new - scroll container with mouse drag-to-pan, sticky header, 75vh max height)
  - apps/web/src/features/daily/daily-kit.tsx (TableScroller re-export, stickyHead/stickyCell, CartonQty with total-pieces tooltip, ColumnHead with the (কার্টন/পিস) sub-label; DayGate no longer dims stale data)
  - apps/web/src/data/queries.ts (no placeholderData on dashboard, day, month, report and staff account queries, so a filter change shows the skeleton)
  - apps/web/src/features/reports/report-page.tsx (sticky first column, carton header; the two per-DSR tables become one collapsible card per DSR)
  - apps/web/src/app/c/[companyId]/error.tsx (new - page error boundary inside the company shell, with retry and reload)
  - day report, godown, DSR sheets, money, accounts, payroll, damage, dashboard, month, opening and import screens (TableScroller; sticky product column where the first column is the product)
  - day report and dashboard (mojibake separators repaired)
  - apps/web/src/features/shell/company-switcher.tsx (the sidebar company name is a button with an up/down icon; its menu lists the person's companies with a check on the current one and a create button that opens the existing company form; the server still allows creation for super admins only)
  - apps/web/src/features/shell/company-shell.tsx, mobile-nav.tsx (the separate company select is replaced by the header switcher)
  - apps/web/src/components/icons.tsx (chevronUpDown)
  - packages/i18n/src/bn.ts (common.cartonPiece, common.totalPieces, common.perCarton, report.person.*, error.pageCrashed, error.pageCrashedHint, error.reload)
affectedActionIds: [none]
affectedResources: [none]
affectedMetrics:
  - none; quantities and amounts are the engine's unchanged values, only formatted and grouped for display (the DSR card total is the engine's per-DSR total row)
affectedUi:
  - every scrollable data table
  - the per-DSR product sales report
  - loading state when changing a date or filter
  - error state of any company page
schemaMigration: none
backfill: not-applicable
historicalPolicy: unchanged
contractCompatibility: unchanged
cacheAndProjectionPlan: query results are no longer kept as placeholders across key changes
securityReview: no permission change; the error panel shows the client error message or the server digest only (server errors are already redacted by Next)
knownGaps:
  - the reported setup crash did not reproduce on mock data or on the test schema; the boundary keeps the shell alive and shows the message so the real cause can be found
  - the report screens were not walked through in the browser this round (the test company has only the sales module); covered by typecheck and build
tests:
  - pnpm check
  - pnpm build
  - headless browser load of every setup screen and two sales screens against the test schema (no exceptions, no failed requests)
rollout: front end only
recovery: revert the commit
