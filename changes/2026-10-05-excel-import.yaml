id: 2026-10-05-excel-import
reason: PLAN §8 and §9 Phase H - Excel month import with header-driven reading, mapping to the catalog, comparison with Excel, preview and commit (documents mode posts and closes the month; opening mode replaces the draft opening)
owners: [importer, contracts, database, application, i18n, web, architecture]
changedDefinitionIds:
  - packages/importer/src/month-sheet.ts (SheetReadResult.people and categories labels; SheetProduct.cartonSize)
  - packages/importer/src/synthetic-workbook.ts (sheet names parameterised; operating cost column)
  - packages/contracts/src/imports.ts (import job, summary, mapping, check, issue, opening difference, commit and discard requests)
  - packages/database/prisma/schema.prisma (ImportJob - raw month input, labels, comparison report and mapping; never the workbook)
  - packages/application/src/imports.ts (inspect, create, list, get, save mapping, discard, commit; preview issues and mode; round-trip check after posting)
  - packages/application/src/opening.ts (nameKey and matchPerson exported; importOpeningFromClosing writes a month closing into the draft opening)
  - packages/application/src/month.ts (closeBlocker exported for the import preview)
  - packages/architecture/src/resources.ts (import-job)
  - packages/i18n/src/bn.ts (validation.import.*, import.issue.*, import screen, nav.administration.import)
affectedActionIds:
  - import.inspect, import.create, import.mapping, import.discard, import.commit (documents | opening)
affectedResources:
  [
    importJob,
    stockEntry,
    dsrDay,
    moneyEntry,
    productHistory,
    opening,
    payrollRun,
    ledger,
    dashboardSummary,
  ]
affectedMetrics:
  - none newly computed; a documents commit is refused unless the ledger's replay of the posted month equals computeMonth over the expected input (closing and month totals)
affectedUi:
  - admin/import (new; period.close) - upload, jobs list, comparison checks with differences, sheet notes, mapping, issues, documents to post, opening differences, commit and discard
schemaMigration: 20261005000000_import_job (applied to test and public) - import_job with CHECKs on month format, status, version, committed consistency and mode; index (company_id, created_at)
backfill: not-applicable (new table)
historicalPolicy: imported documents carry reference import:{jobId} and are corrected like manual ones (reopen the month, reverse); an import job is never edited after commit or discard
contractCompatibility: additive routes GET|POST /companies/{id}/imports (POST raw xlsx; without ?sheet it only lists month sheets), GET /imports/{jobId}, PUT /imports/{jobId}/mapping, POST /imports/{jobId}/commit, POST /imports/{jobId}/discard
cacheAndProjectionPlan: no stored projections; the preview is recomputed on every read; the commit invalidates every posting resource on the client
securityReview: T18 - every action needs period.close; opening mode also opening.prepare; documents mode also each posting permission the month uses. Upload size capped (MAX_IMPORT_WORKBOOK_BYTES); the workbook is parsed in memory and never stored; only a SHA-256 hash, file name and raw month inputs are kept. Commit locks the company row, re-runs the preview inside the transaction and claims the job by version; writes idempotent and audited (import.create, import.mapping, import.discard, import.commit, opening.import)
knownGaps:
  - P07 - a distributor staff money column mapped to an SR is refused (D18 vs Excel's cash formula)
  - market due is imported into the legacy (no DSR) bucket; per-DSR due is not read from the sheet
  - no one-step undo of a committed import beyond reopening the month and reversing its documents
  - the end-to-end import of the real Aug 2026 sheet through the screen was not run (the reader and engine part is covered by pnpm verify:workbook)
  - browser walkthrough not done
tests:
  - pnpm check (format, lint incl. module boundaries, typecheck of 10 packages, 115 Vitest tests incl. importer people/category labels)
  - pnpm test:integration 56/56 on the Neon test schema (8 Phase H - inspect; comparison, proposed mapping and opening difference; mapping save, stale version and unknown target; documents counts; permissions FORBIDDEN; acceptDifferences and wrong mode refused; documents commit posts and closes the month with exact day and month figures and import references; second commit refused, re-upload sees the closed month, discard; opening mode SR column refused, openingVersion required, draft opening from the closing)
  - pnpm build
  - pnpm verify:workbook (local only) - Aug 2026 and Jul 2026 (20-column blocks) still match; Sep 2026 differences are the labelled Excel mistakes
  - not run - browser walkthrough
rollout: migration applied; screen live behind NEXT_PUBLIC_DATA_SOURCE=http (the demo mock answers MODULE_UNAVAILABLE)
recovery: revert commit and drop import_job with a down migration; committed imports are ordinary documents and stay valid
