id: 2026-10-29-cash-in-hand-card-and-total-cost
reason: >-
  Owner 2026-10-29 (D106). The owner noticed that দোকানের বাকি দেওয়া (shop credit given) is cash
  not actually received that day, so মোট বিক্রি-based cash math never matches the real till. Wants
  a হাতে জমা card (sales − due given + due collected) on both the DSR day sheet and the dashboard,
  and মোট খরচ narrowed to commission + operating + DSR cost (salary included), dropping returns and
  damage from that figure.
owners: [domain, contracts, i18n, web]
changes:
  - >-
    packages/domain field.ts: new cashInHandOf(sales, dueGiven, dueCollected) = sales − dueGiven +
    dueCollected, rounded to settlement scale (display only; same shape as dsrCashSettlement minus
    its expenses/staffMoney terms); exported from index.ts
  - >-
    packages/domain sales-profit.ts dashboardTotals: মোট খরচ (totalCost) no longer adds
    returnValue or damageSaleValue — totalCost = expenses + staffCost + commission. profitCost and
    netProfit are unchanged (they never included return/damage); মোট বিক্রি (totalSales =
    issuedValue − totalCost, D74) rises by the dropped return + damage value
  - packages/domain staff-cost.test.ts: dashboardTotals fixture updated (totalCost 1825.00 → 1450.00, totalSales 675.00 → 1050.00; profitCost/netProfit unchanged)
  - packages/contracts reporting.ts: totalCost doc comment updated; no schema change (cashCollected already existed, required, already summed company-wide in daily.ts dashboardOf)
  - >-
    packages/i18n bn.ts: dashboard.card.cashInHand ("হাতে জমা"), dsr.cash.inHand and
    dsr.cash.inHandHint added
  - >-
    apps/web dsr-days-page.tsx (SheetEditor): new StatTile হাতে জমা above the সামারি TableSummary,
    value cashInHandOf(cash) where cash.{sales,dueGiven,dueCollected} are the sheet's own existing
    cash-check inputs (no new data fetch)
  - >-
    apps/web dashboard-page.tsx summaryCards: new card হাতে জমা (value d.cashCollected, tone
    info) placed right before হাতে জমার শর্ট; no server change since cashCollected was already
    computed and summed for the range
affectedActionIds: []
financialImpact: >-
  display only, both changes. হাতে জমা is a new read-only figure, nothing posted. মোট খরচ /
  মোট বিক্রি change their shown numbers (মোট বিক্রি rises by returnValue + damageSaleValue) but no
  cash, balance, profit or posted record changes — totalCost/totalSales/profitCost/netProfit are
  all "shown only" per D69/D74.
backfill: none
tests: >-
  pnpm test:domain (173/173), pnpm test (318/318), pnpm check:types (10/10 packages), pnpm lint,
  pnpm format:check
rollout: deploy the app; no migration
recovery: revert the commit
