id: 2026-10-22-batch-free-pieces
reason: >-
  D68 amended (owner 2026-10-22) - free goods are never a separate batch: an order's free pieces go
  into the order's own batch at its purchase price, company free goods (incentive) and damage
  replacements join the newest named batch; batch dropdowns no longer show free batches. The DSR
  sheet has no "pick a batch" option: the first batch is preselected and a product without a batch
  is a disabled row ("পণ্য মজুদ করুন").
owners: [domain, contracts, database, application, i18n, web]
changes:
  - packages/database - migration 20261022020000_batch_free_pieces (drops stock_entry.free_batch_id and product_batch.free)
  - packages/domain - receiveFree (free goods and replacements into the newest named batch, zero-cost automatic batch only before any named one); batches.test.ts case
  - packages/contracts - stock entry loses freeBatchId / freeBatchSeq, ProductLot loses free; order line doc (free-only order takes the latest batch's purchase price without a rate)
  - packages/application - orderBatch: one batch per order line, null purchase price = latest batch's; batch due counts paid + free pieces; no free-batch price lock
  - packages/i18n - order hint and order description, DSR batch hint, dsr.sheet.noStock (replaces pickBatch); unused receipt cost hints and freeOnly removed
  - apps/web - order form (latest batch incl. opening, rate always sent, batch shown for free-only rows), receipt form (no free lot handling), posted entries one batch, ফ্রি badge only on zero-cost automatic batches (isFreeAuto in daily-kit), DSR sheet lines always on a batch (first in stock by default), rows without a batch disabled with a tooltip
  - packages/application/src/scripts/seed-demo.ts - run-scoped request keys, reuse of global staff by name, skips cash openings held by another company
affectedActionIds: [purchase.create, purchase.reverse, sale.create, sale.post]
financialImpact: >-
  Free pieces (order free goods, company incentive goods, damage replacements) carry the purchase
  price of the batch they join, so stock value and cost of goods sold include them at that price
  (before: cost 0 in a free batch). The order bill (paid pieces x carton rate), the company balance
  and the replacement recovery memo (quantity x reviewed unit cost) are unchanged.
backfill: none (no free batches or DSR lines on automatic batches existed in the dev database; the engine recomputes from history)
tests:
  - pnpm check (307 unit tests, incl. the new D68 free goods case)
  - pnpm test:integration (phase-l updated: one batch for paid + free, stock value 5520, free-only order joins the latest batch)
rollout: pnpm db:migrate, restart the app
recovery: revert the commit and the migration (re-adds the columns empty)
