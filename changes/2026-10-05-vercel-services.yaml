id: 2026-10-05-vercel-services
reason: Deploy on Vercel as a Services project. The repository has one deployable app (apps/web serves the UI, /api/v1 and /api/auth), so it is a single public service; functions run in sin1 next to Neon ap-southeast-1 per T19.
owners: [web, ops]
changedDefinitionIds:
  - vercel.json (service web at apps/web, framework nextjs, public on all paths, regions sin1, no bindings)
affectedActionIds: [none]
affectedResources: [none]
affectedMetrics:
  - none; no application code changed
affectedUi: [none]
schemaMigration: none (pnpm db:migrate stays a separate step against DIRECT_URL before deploying)
backfill: not-applicable
historicalPolicy: unchanged
contractCompatibility: unchanged
cacheAndProjectionPlan: unchanged
securityReview: Vercel project env holds DATABASE_URL (pooled), BETTER_AUTH_SECRET (production-only), BETTER_AUTH_URL (production domain) and NEXT_PUBLIC_DATA_SOURCE=http; DIRECT_URL, TEST_DATABASE_URL and BOOTSTRAP_ADMIN_* are not set there
knownGaps:
  - not yet deployed or tested with vercel dev
  - top-level regions in services mode not yet verified on a deployment
tests:
  - prettier --check vercel.json
rollout: create the Vercel project from the repository root, set the env vars, run db:migrate, deploy, then re-run benchmark:sql from production (T19)
recovery: revert the commit
