id: 2026-10-22-sr-cost-password
reason: >-
  Owner 2026-10-22 - (1) any password of at least 6 characters, no other rule; (2) the dashboard's
  এসআর খরচ is what the SRs owe (the former এসআরের কাছে মোট পাওনা card) and the two cards become
  one; গ্রহণ করা পণ্যের মূল্য is dropped (মজুদের মূল্য stays); (3) follow-ups - আজ shows only that
  day's SR cost, the SR incentive is its own step in the chain, and কর্মীর ব্যালান্স shows each
  person's part of the costs with a মোট row to match the cards. Amends D67 (5) and (6).
owners: [domain, contracts, auth, application, i18n, web]
changes:
  - packages/contracts, packages/auth - MIN_PASSWORD_LENGTH 12 -> 6 (contracts and Better Auth stay equal; password-policy.test)
  - apps/web staff-page - the field login password uses MIN_PASSWORD_LENGTH instead of a literal 12
  - packages/i18n - password hints say 6; dashboard.card.srAdvanceDue, dashboard.card.received, dashboard.receivedValue removed; dashboard.card.srIncentive, report.column.srTotal, report.table.srBalances added; report.column.staffCost reads ডিএসআর খরচ (বেতনসহ)
  - packages/domain day-summary - srCost (single day = Σ closing − opening srLoan, longer range = Σ closing srLoan); DaySummary.srIncentive; dashboardChain subtracts srIncentive; staff-cost.test cases
  - packages/domain - money-based srCost / SR_COST_SIGN removed (no other caller)
  - packages/application daily.ts - dashboard srCost and srIncentive fed to dashboardChain and returned; srAdvanceDue removed (also from the master panel sums, which add srIncentive)
  - packages/application month.ts - staff-balances splits into the DSR table and an SR table (অগ্রিম = the SR's part of এসআর খরচ, এসআর ইনসেনটিভ, মোট), each with a totals row
  - packages/contracts reporting - dashboard summary loses srAdvanceDue, gains srIncentive; srCost doc
  - apps/web dashboard - summary cards without এসআরের কাছে মোট পাওনা and গ্রহণ করা পণ্যের মূল্য; − এসআর ইনসেনটিভ card in the chain
affectedActionIds: []
financialImpact: >-
  নিট ব্যালান্স and নিট লাভ subtract the SR cost (one day: that day's SR loan change; longer range:
  the SRs' outstanding loan at its end) and the period's SR incentive expense (cash paid and owed),
  instead of the period's money paid out for SRs (loan + incentive + payment - repayment). The
  profit report is unchanged. An SR incentive entered without a person counts in the card but in
  no row of কর্মীর ব্যালান্স.
backfill: none
tests:
  - pnpm check (307 unit tests; the money-based SR cost test was replaced by the domain srCost case)
  - pnpm test:integration (105/105 before the follow-ups; phase-e/g/j rerun after a test-database deadlock in setup); phase-e and phase-j (dashboard summary) 22/22 after them
rollout: deploy the app (existing passwords keep working)
recovery: revert the commit
