id: 2026-10-22-sr-cost-password
reason: >-
  Owner 2026-10-22 - (1) any password of at least 6 characters, no other rule; (2) the dashboard's
  এসআর খরচ is what the SRs owe (the former এসআরের কাছে মোট পাওনা card) and the two cards become
  one; গ্রহণ করা পণ্যের মূল্য is dropped (মজুদের মূল্য stays). Amends D67 (6).
owners: [domain, contracts, auth, application, i18n, web]
changes:
  - packages/contracts, packages/auth - MIN_PASSWORD_LENGTH 12 -> 6 (contracts and Better Auth stay equal; password-policy.test)
  - apps/web staff-page - the field login password uses MIN_PASSWORD_LENGTH instead of a literal 12
  - packages/i18n - password hints say 6; dashboard.card.srAdvanceDue, dashboard.card.received, dashboard.receivedValue removed
  - packages/application daily.ts - srCost = Σ staff closing srLoan at the end of the range, fed to dashboardChain; srAdvanceDue removed (also from the master panel sums)
  - packages/contracts reporting - dashboard summary loses srAdvanceDue; srCost doc
  - packages/domain - money-based srCost / SR_COST_SIGN and DaySummary.srCost removed (no other caller)
  - apps/web dashboard - summary cards without এসআরের কাছে মোট পাওনা and গ্রহণ করা পণ্যের মূল্য
affectedActionIds: []
financialImpact: >-
  নিট ব্যালান্স and নিট লাভ now subtract the SRs' outstanding loan at the end of the range instead
  of the period's money paid out for SRs (loan + incentive + payment - repayment). SR incentive no
  longer appears in the dashboard chain; the profit report's SR incentive expense is unchanged.
backfill: none
tests:
  - pnpm check
rollout: deploy the app (existing passwords keep working)
recovery: revert the commit
