id: 2026-10-11-goods-due-split
reason: D46 (owner decision 2026-10-11) - goods due from the company is never negative; an excess receipt is billed in money only and offsets no later order. Replaces the earlier পাওনা/দেনা two-column display.
owners: [domain, contracts, application, i18n, web, importer]
changes:
  - packages/domain - compute-month.ts floors each product's goods due at 0 every day (max(0, previous + ordered - received)) and at opening load; opening.ts checkOpening accepts only a whole number >= 0; unit tests for the floor, a later order after an excess receipt, the unchanged normal case and unchanged receipt bill/company payable
  - packages/contracts - opening stock dueFromCompany uses wholeNumberStringSchema (message validation.opening.due)
  - packages/application - seed-demo-plan.ts opening dueFromCompany = max(0, closing due); month.ts reports show one due column again (no split helper)
  - apps/web - day stock view, godown order table, month table and the opening stock form show a single goods-due column/input (whole >= 0)
  - packages/i18n - validation.opening.due says 0 or more; one key per due column; the pawna/dena/dueBoth keys of the earlier split are gone
  - packages/importer - verify:workbook skips a product's goods-due comparisons (day cells and closing) from the first day Excel's running due is negative to month end (D46); everything else compared as before
  - docs - D46 rewritten and D31 marked amended in decisions.md; PLAN.md §2 due_from_co line and company-due report description
affectedActionIds: []
financialImpact: goods-due pieces and value floor at 0 - no money figure changes (receipts still bill every received piece, company payable unchanged). Excel parity differs where Excel's running due is below 0.
backfill: Demo company Drinko (ডেমো) opening stock lines with a negative goods due re-saved as 0 (money side untouched)
tests:
  - pnpm check
  - pnpm build
  - pnpm test:integration
  - pnpm verify:workbook (goods-due comparisons skipped after Excel's due goes negative)
rollout: deploy the app
recovery: revert the commit
