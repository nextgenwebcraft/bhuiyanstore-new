id: 2026-10-23-shop-due-picker
reason: >-
  Owner 2026-10-23 (D78). On দোকানের বাকি ও আদায় the shop dropdown shows each shop's
  mobile and address with its name, and a mobile number finds that shop.
owners: [web, i18n, docs]
changes:
  - apps/web ShopDueEntry combobox options - the second line is saved phone (Bangla digits) and area as `phone | area`, with no field labels, and the same line stays under the field after a pick; searchText is the phone digits so a typed mobile matches in Bangla or Latin digits with or without spaces or dashes; মুছুন clears the field; the label stays the shop name so D50 exact-name reuse and inline create are unchanged; current due stays on the right
  - packages/i18n shop.pick - placeholder says name, address or mobile
affectedActionIds: []
financialImpact: >-
  none - display and client-side filtering only; posted shop id, amount and kind are unchanged
backfill: none
tests:
  - combobox filterOptions already matches searchText (phone) with Bangla and Latin digits
rollout: deploy the app; no migration
recovery: revert the commit
