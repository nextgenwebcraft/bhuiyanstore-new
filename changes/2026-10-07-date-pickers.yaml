id: 2026-10-07-date-pickers
reason: Owner asked for the calendar range filter and a smooth single date picker in the style of the dreamemirates frontend, replacing the native date and month inputs.
owners: [web, i18n]
changedDefinitionIds:
  - apps/web/src/components/calendar-math.ts (new - ISO string month grid with Saturday-first weeks, range presets; no Date timezone drift)
  - apps/web/src/components/date-picker.tsx (new - DatePicker, DateRangePicker with presets and two months, MonthPicker; native popover in the top layer, keyboard navigation, slide animation)
  - apps/web/src/app/globals.css (calendar slide and pop-in animations)
  - packages/i18n/src/format.ts (formatShortDate, formatMonth, monthNames, weekdayNames)
  - packages/i18n/src/bn.ts (date.* picker labels and date.preset.*)
  - apps/web/src/features/daily/daily-kit.tsx (working date bar)
  - report, accounts, payroll, month, opening, staff, product history and godown screens (date, range and month inputs replaced)
