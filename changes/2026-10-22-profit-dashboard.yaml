id: 2026-10-22-profit-dashboard
reason: >-
  Owner 2026-10-22 (D69) - profit from the DSR sheet lines by the owner's formula; the dashboard
  summary shows the cost cards without a chain, a মোট খরচ card, মোট প্রফিট and নিট প্রফিট (মোট প্রফিট
  minus operating and DSR cost); নিট ব্যালান্স and ডেলিভারি পণ্যের ক্রয়মূল্য removed; SR incentive
  cash retired; the DSR sheet shows its amounts as the profit's parts; pieces roll up into cartons.
owners: [domain, contracts, application, i18n, web]
changes:
  - packages/domain sales-profit (new) - salesProfit, profitLinesOf, dashboardTotals; day-summary loses dashboardChain and srIncentive, gains salesProfit; staff-cost.test cases
  - packages/contracts reporting - dashboard summary loses srIncentive, netBalance, costOfSold; gains totalCost, salesProfit, netProfit
  - packages/application daily.ts - dashboard totals from dashboardTotals; postMoneyEntry rejects srIncentive (validation.daily.kindRetired)
  - packages/application master-panel.ts - summed keys follow the new dashboard fields
  - packages/application month.ts - SR balance table keeps only অগ্রিম; incentive extras removed
  - apps/web dashboard - cards in the D69 order (অপারেটিং + ডিএসআর খরচ before মোট প্রফিট; মোট খরচ and এসআর খরচ in the lower row); dashboardTotals and the summary gain profitCost
  - apps/web sr-page and the sr-accounts incentives route - SR incentive input, column and screen removed
  - apps/web dsr-days-page - profit-part cards above the sheet (TableSummary hint for pieces); carton and piece fields linked (typing one fills the other; pieces are saved)
  - packages/i18n - dashboard.card.totalCost, salesProfit, netProfit; dsr.profit.*; validation.daily.kindRetired; incentive and old card keys removed
affectedActionIds: []
financialImpact: >-
  The dashboard's profit is now the DSR sheet profit by the D69 formula (each line at its batch's
  prices) and নিট প্রফিট subtracts only operating and DSR cost; the SR cost and the other cost cards
  no longer reduce any figure. Past SR incentive entries keep their effect on cash and history; new
  ones are refused. The monthly profit report is unchanged.
backfill: none
tests:
  - pnpm check (format, lint, types, 308 unit tests incl. salesProfit and dashboardTotals cases)
  - integration tests not run for this change
rollout: deploy the app
recovery: revert the commit
