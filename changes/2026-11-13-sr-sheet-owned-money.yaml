summary: >
  দৈনিক বিক্রয় হিসাব: দোকানের বাকি/আদায়, DSR ও SR অগ্রিম/শর্ট এবং অপারেটিং খরচ এখন যে SR
  শিটে এন্ট্রি করা হয়েছে শুধু সেই শিটে দেখায় ও গণনা হয় (আগে তারিখ ধরে সব SR শিটে দেখাত,
  ফলে হাতে জমা/হ্যান্ডওভার শর্টে দুইবার বাদ যেত)। SR কার্ডে "মোট বিক্রি" বদলে "মোট টাকা"
  (জমা হওয়ার কথা), "মোট প্রফিট" বাদ।
owner: money entries (contracts + application daily/handover-short); UI cards (dsr-days-page).
changes:
  - database MoneyEntry.sheetStaffId (migration 20261113010000, backfilled by SR / DSR line /
    single-sheet date); 20261113020000 assigns the two 12 Nov 2026 entries (shop due 650,
    DSR short 26) to Rayhan's sheet (no-op on any other database).
    20261113030000 puts the 25 older entries no rule could place on Hasan (to adjust by hand).
  - contracts moneyEntryPostRequest/moneyEntry carry sheetStaffId; money-entries list filters by it.
  - application handover-short counts only the sheet's own entries (dues, DSR/SR cash, খরচ);
    reversing a sheet reverses only its own money (no longer every expense of the date);
    correcting a posted sheet now keeps the money entered on it.
  - web cards (shop due, staff cash, SR cash, operating cost) post and list by sheetStaffId;
    sheetMoneyFigures is the one owner of a sheet's money figures; SR cards and day strip show
    মোট টাকা = dsrCashSettlement expected (D107 settlement maths unchanged).
open:
  - Entries that no backfill rule could place stay without a sheet and count on no sheet.
  - Handover shorts price a line by its stored sale price (unchanged, auto-batch lines without
    one count as 0).
checks: pnpm check:types, pnpm test (363), integration phase-e / phase-j / sheet-money on schema test.
  Not run: pnpm lint clean (pre-existing unused-var errors), UI in a browser.
