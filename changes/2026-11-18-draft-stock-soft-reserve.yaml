id: 2026-11-18-draft-stock-soft-reserve
reason: >-
  Owner 2026-11-18: when one SR saves a draft সামারি on a batch, other SRs must see
  that quantity as unavailable and cannot draft-oversell the same stock — without
  putting drafts into the ledger. Soft reservation (D137) amends D34/D136.
owners: [application, apps/web, docs]
changes:
  - >-
    packages/application stock-guard — peerDraftStockTakes; ensureDraftSalesCover
    merges other company drafts with this sheet's takes
  - packages/application daily saveDsrDayIn — pass exclude staffId+date for peers
  - >-
    apps/web dsr-sheet-entry / dsr-days-page — মজুদ remaining subtracts other SRs'
    same-date draft nets (peerDraftReservedNet)
  - docs/decisions.md D34 note + D137; implementation-status
affectedActionIds: [sale.create]
financialImpact: >-
  No ledger rewrite. Drafts still stay out of runLedger. Availability for draft save
  and the UI stock column now subtract peer draft issued−returned; discard frees the
  reservation. Post/correct still use ensureStockCovers.
backfill: none
tests: >-
  packages/application stock-guard.test.ts; apps/web peer-draft-stock.test.ts;
  pnpm test:predeploy
rollout: deploy
recovery: revert commit
