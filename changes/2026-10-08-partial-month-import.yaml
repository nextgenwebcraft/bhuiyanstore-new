id: 2026-10-08-partial-month-import
reason: The owner wants September and October 1–7 from the Oct workbook in the system while October is still running. The month import could only bring whole months and always closed them, and the upload screen could not ask for the "blocks after the last day go to the last day" option the reader already had.
owners: [importer, application, contracts, web, i18n]
changedDefinitionIds:
  - packages/importer/src/month-sheet.ts (ReadMonthOptions.through; Expectation.day; a partial read keeps days ≤ through and only day-level checks, ignores blocks after the month)
  - packages/application/src/imports.ts (createImportJob through; StoredReport.through; preview checks the previous month is closed and the date is not in the future instead of closeBlocker; existing prices and the ledger round trip stop at the through date; a partial commit does not close the month; a partial job cannot become an opening)
  - packages/application/src/month.ts (previousMonth exported)
  - packages/contracts/src/imports.ts (ImportJobSummary.through)
  - apps/web/src/app/api/v1/companies/[companyId]/imports/route.ts (through query parameter)
  - apps/web/src/features/administration/import-page.tsx, data/ports, data/http, data/queries (through date and extra-blocks option on upload; through shown on jobs)
  - packages/i18n/src/bn.ts (labels and issue texts)
affectedActionIds: [period.close (import.create, import.commit)]
affectedResources: [import_job, month_close]
affectedMetrics:
  - none; a partial import posts the same documents as manual entry and must reproduce the engine run to the through date exactly
affectedUi:
  - upload dialog: optional "যে তারিখ পর্যন্ত আনবেন" date and the day-31 option
  - job list and detail show the through date
schemaMigration: none (through is stored in the job report JSON)
backfill: not-applicable
historicalPolicy: existing jobs have no through date and behave as before
contractCompatibility: additive (ImportJobSummary.through, nullable)
cacheAndProjectionPlan: import commits already invalidate the ledger queries
securityReview: no new permission; the through date is validated against the sheet's month on the server
knownGaps:
  - a partial import needs an empty month, so the rest of October must be entered by hand (or the October documents discarded before a full re-import)
  - Phase E integration test timed out (60 s) against the remote test database in this run; unrelated to this change
tests:
  - pnpm check (136 tests)
  - packages/importer month-sheet.test.ts (partial read, rejected dates)
  - pnpm test:integration phase-h (partial commit leaves the month open; partial opening refused)
rollout: no migration; deploy the app
recovery: revert the commit; committed partial jobs remain valid documents
