id: 2026-10-09-dsr-field-panel
reason: DSRs record each shop visit on their phone (delivery, cash, old due, damage exchange); the office day sheet uses those entries and only reconciles cash at day end (D40).
owners: [web, application, contracts, domain, database, architecture, i18n, docs]
changedDefinitionIds:
  - packages/architecture - permissions field.entry and field.shop_create; resource field-day
  - packages/contracts - field.ts (visit, day, shop, save/delete/login requests); fieldPermissionIds and isFieldOnly in definitions/permissions.ts
  - packages/domain - field.ts lineValue, fieldVisitTotals, fieldRemaining
  - packages/application - field.ts (own staff only via staff.user_id; server-side day price; delivered + exchanged <= samari in hand, serialized per DSR; version checks; idempotent; audited), field-posting.ts (posting writes per-shop marketDueNew/marketDueCollected entries and one buyerExchange custody case, locks visits; reversal undoes them; sheet-level dues refused while visits exist), createStaffLogin (super-admin; role "ডিএসআর (মাঠ)" created on first use)
  - apps/web/src/app/api - field/day, field/visits, field/visits/{id}, field/shops, staff/{id}/login
  - apps/web - sales/field mobile panel; FieldShell for field-only users (redirected there from the picker and other paths); staff page "লগইন তৈরি"; DSR sheet field entries panel with prefill and discrepancy flags
  - packages/database - staff.user_id, shop.added_by_staff_id, money_entry.dsr_day_id, damage_case.dsr_day_id, field_visit, field_visit_line
  - packages/i18n - field.*, staff.login.*, nav.sales.field
affectedActionIds: [field.entry, field.shop_create, sale.create, sale.post, sale.reverse]
affectedResources: [field_visit, dsr_day, money_entry, damage_case, shop, staff, user]
affectedMetrics:
  - market due by shop: from posted field visits (sales - cash per shop, plus collections); the DSR's sales stay per DSR from the sheet
  - replacement pieces counted once as DsrLine.damaged; the exchange case holds custody only (never from stock)
affectedUi:
  - sales/field (new, mobile); staff page; DSR day sheet; company picker
schemaMigration: 20261009030000_setup_field_panel (additive; applied to test and public)
backfill: not-applicable
historicalPolicy: days posted before this change have no visits and post as before
contractCompatibility: additive
cacheAndProjectionPlan: posting a DSR day also invalidates field day, money, shop and damage queries
securityReview: a field user holds only field.* permissions, sees only their own staff record's day, cannot read another DSR (getDsrFieldDay needs sale.view), never sends a price; login creation is super-admin only with a one-time password (must change at first sign-in)
knownGaps:
  - browser walkthrough on a 360px phone not done
  - no offline entry (D15: online only)
tests:
  - domain field.test.ts
  - production-setup.integration.ts - login link and duplicate refused; own day only; server price; samari limit; another DSR cannot delete a visit; DSR-added shop; posting writes per-shop entries and locks visits; reversal reopens them
rollout: migration applied; deploy; create logins from the staff page
recovery: revert the commit; unposted visits can be deleted, posted days reversed first
