id: 2026-10-28-master-companies
reason: >-
  Owner 2026-10-28 (D91, extends D90). The company picker's add/edit/delete
  was only reachable from outside the master panel; the owner asked for a
  company module inside the master panel itself.
owners: [web, i18n]
changes:
  - >-
    apps/web new master-panel hub "Company" (master/companies): lists every company (useWorkspaces,
    same as the picker) with add, edit and delete buttons; new route
    app/c/[companyId]/master/companies/page.tsx and feature features/master/companies-page.tsx
  - >-
    apps/web CompanyForm gained an edit mode (optional `company` prop): prefills name/theme/modules
    and calls updateCompany instead of createCompany, skips the starter-data hint and the post-save
    redirect to opening
  - apps/web/features/shell/navigation.ts new "companies" master hub and nav item
  - packages/i18n nav.master.companies
affectedActionIds: [company.create, company.update, company.delete]
financialImpact: none - reuses the existing create/update/delete services unchanged
backfill: none
tests: pnpm test (318/318, incl. updated navigation.test.ts), pnpm --filter @bsd/web exec tsc --noEmit, eslint
rollout: deploy the app; no migration
recovery: revert the commit
