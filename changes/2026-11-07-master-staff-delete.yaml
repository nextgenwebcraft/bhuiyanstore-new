id: 2026-11-07-master-staff-delete
reason: >-
  Owner: deleting আমাদের স্টাফ from the master panel returned validation.staff.unknown
  for people shown as managers. deleteStaff treated employer=supplier as SR even when
  the only assignment was a manager/DSR hire (D80/D110).
owners: [application, web]
changes:
  - >-
    packages/application staff.ts: master-panel delete refuses only people with an `sr`
    role assignment; master create/update force employer=distributor (D80); master update
    loads any non-SR person of the tenant like delete
  - >-
    apps/web staff-page: master edit hides the employer field and always submits
    distributor
  - >-
    packages/application phase-i.integration.ts: mistagged supplier+manager is deletable
    from the master panel; real SR still refused
affectedActionIds: [staff.delete, staff.create, staff.update]
financialImpact: none — only who may be hard-deleted from the master panel
backfill: >-
  Existing mis-tagged rows (supplier employer with only a master manager/DSR assignment)
  become deletable after deploy; editing them on the master panel also rewrites employer
  to distributor. No migration.
tests: >-
  packages/application phase-i.integration.ts — master delete of unused manager, refusal
  of SR, delete of supplier-employed manager without sr role, refusal of in-use DSR
rollout: deploy the app; no migration
recovery: revert the commit
