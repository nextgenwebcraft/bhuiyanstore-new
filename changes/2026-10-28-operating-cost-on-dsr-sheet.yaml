id: 2026-10-28-operating-cost-on-dsr-sheet
reason: >-
  Owner 2026-10-28 (D98). Operating cost entry belonged on দৈনিক বিক্রয়
  হিসাব, right above দিনশেষে নগদ মিলানো, not on a separate বেতন ও খরচ page;
  no ধরন (kind) field needed since it is always the plain expense kind.
owners: [web, i18n]
changes:
