    expense entries with reverse, reusing usePostMoneyEntry/useMoneyEntries/useReverseMoneyEntry
  - apps/web dsr-days-page.tsx renders it between SrCashEntry and CashCheck
  - >-
    apps/web finance/expenses/page.tsx keeps only the staffCostPaid kind (its kind picker already
    hides itself with one kind); packages/i18n money.description.expenses text updated to match
  - packages/i18n dsr.operatingCost.title
affectedActionIds: []
financialImpact: none - same money_entry kind "expense"; dashboard/Company Hishab Reports read it unchanged
backfill: none
tests: pnpm test (318/318), pnpm --filter @bsd/web exec tsc --noEmit, eslint
rollout: deploy the app; no migration
recovery: revert the commit
