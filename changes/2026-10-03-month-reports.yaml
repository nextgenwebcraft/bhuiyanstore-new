id: 2026-10-03-month-reports
reason: PLAN §9 Phase F - the workbook's month side, the §6 reports with CSV/XLSX export, and month close/reopen; every figure is a projection of one month-engine run
owners: [application, contracts, importer, i18n, web]
changedDefinitionIds:
  - packages/contracts/src/month.ts (month view, close result, report ids/columns/tables; MonthCloseResult moved here from application so the web app shares it)
  - packages/application/src/ledger.ts (rangeRun - one engine run over any date range, opening at the previous day's closing or the active opening at the cutoff)
  - packages/application/src/month.ts (getMonthView, closeMonth, reopenMonth, getReport, exportReport; close blockers notOver, previousOpen, drafts; reopen refused while a later month is closed)
  - packages/importer/src/report-export.ts (reportCsv UTF-8 with BOM, buildReportWorkbook one sheet per table; labels translated server-side via @bsd/i18n)
  - packages/i18n/src/bn.ts (labelOf; month, report table/column/line and validation keys)
  - apps/web/src/data (port, HTTP adapter, query keys and hooks; the mock answers MODULE_UNAVAILABLE for Phase F)
  - apps/web/src/lib/download.ts (downloadBlob shared by opening template and report export)
affectedActionIds:
  - month.close, month.reopen (audited; reopen keeps the removed snapshot in `before`)
affectedResources: [ledger]
affectedMetrics:
  - month totals, range totals and report totals are engine fields only (nothing is summed in application or UI); a range report opens at the closing of the day before `from`
affectedUi:
  - reports/month (month view, report.view) and finance/period-close (same view with close/reopen, period.close)
  - reports/stock (stock, company due, damage, cartons), reports/money (sales, profit, market due, daily cash), reports/staff (DSR sales, staff balances), finance/receivables (market due), finance/payables (company due); CSV and Excel download with report.export
schemaMigration: none (month_close table came with Phase E)
backfill: not-applicable
historicalPolicy: a closed month stores the engine closing as its snapshot; later months start from it; posting and reversal into a closed month are refused (Phase E guard). Months must close in order and reopen in reverse order
contractCompatibility: additive routes GET /api/v1/companies/{id}/months/{YYYY-MM}, POST .../months/{YYYY-MM}/close|reopen, GET .../reports/{report}?from&to[&format=csv|xlsx]
cacheAndProjectionPlan: no stored projections; reports replay from the last closed month (or the opening). Ranges are capped at 365 days. Measure before caching (Redis stays out)
securityReview: report.view to read; cost needs inventory.cost_view, profit needs cost view + report.profit_view (profit report refused otherwise), staff balances need finance.view, export needs report.export, close/reopen need period.close. Close/reopen take the company row FOR UPDATE against concurrent postings (which take it FOR SHARE) and are idempotent by request key. Module enablement still not enforced server-side
knownGaps:
  - cash book per account is not modelled (money entries carry no account); daily-cash stands in
  - staff/SR statements with entry lines are Phase G
  - XLSX numeric cells are JS numbers (presentation only; CSV keeps the exact decimal strings)
  - a price backdated into a closed month would change recalculation of later open months; closed months themselves keep their snapshot. A guard on dated price changes is still needed
tests:
  - pnpm check (format, lint, typecheck of 10 packages, 99 Vitest tests)
  - pnpm test:integration 35/35 on the Neon test schema (4 Phase F - month view equals an independent computeMonth; close ordering, drafts, notOver, idempotent replay, snapshot, backdating blocked, reopen rules, audit rows; range report equals the engine, cutoff clamp, bad range/unknown report, every report's CSV has translated labels, XLSX header; viewer redaction and refused profit/close/export)
  - pnpm build
  - not run - browser walkthrough; real-workbook month comparison through the services (Phase H)
rollout: no migration; screens live behind NEXT_PUBLIC_DATA_SOURCE=http
recovery: revert commit (no schema change); reopening a month removes its snapshot
