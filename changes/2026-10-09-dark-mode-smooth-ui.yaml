id: 2026-10-09-dark-mode-smooth-ui
reason: The owner asked for an eye-comfortable dark mode, a soft background gradient, smooth navigation without the click freeze, one deep-orange action color (scrollbars too), consistent component shapes and full sidebar names on hover.
owners: [design-system, web, i18n]
changedDefinitionIds:
  - packages/design-system/src/tokens.css (dark default + light theme via data-theme; --action, --action-hover, --action-foreground, --backdrop, --canvas-gradient, --ease-out)
  - apps/web/src/app/globals.css (brand utilities map to --action; orange thin scrollbars incl. page; background gradient; base-layer color transitions; dialog pop-in and backdrop; page-in animation)
  - apps/web/src/app/layout.tsx (data-theme="dark", pre-paint theme script)
  - apps/web/src/app/c/[companyId]/loading.tsx (new; instant skeleton on navigation while the shell stays)
  - apps/web/src/features/shell/theme.tsx, theme-script.ts (new; sun/moon toggle in the top bar, saved per device)
  - apps/web/src/features/shell/nav-progress.tsx (new; top progress bar from link click to arrival)
  - apps/web/src/components/overflow-tooltip.tsx (new; tooltip only when a label is truncated, used by the sidebar)
  - apps/web/src/components (button, field, stat-tile, table-summary, status-badge, skeleton) and all dialogs (radius 2xl, raised shadow, shared backdrop)
affectedActionIds: []
affectedResources: []
affectedMetrics:
  - none; presentation only
affectedUi:
  - whole app dark by default; light remains available from the top bar
  - every action accent (primary buttons, active nav, selected dates, badges, scrollbars, focus ring) is deep orange instead of the company color; the company color stays on the company mark
schemaMigration: none
backfill: not-applicable
historicalPolicy: not-applicable
contractCompatibility: unchanged
cacheAndProjectionPlan: none
securityReview: the inline theme script is a constant string (no user input); it only reads one localStorage key
knownGaps:
  - first visit of each route in `pnpm dev` still compiles on demand; production builds are not affected
  - dark-mode contrast was chosen from token values, not measured on every screen
tests:
  - pnpm check (136 tests)
  - pnpm build
rollout: deploy the app
recovery: revert the commit; no data involved
